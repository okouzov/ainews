<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A judge's gavel resting on a stack of books beside a courthouse column">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1408"/><stop offset="1" stop-color="#2a1f0c"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5330"/><stop offset="1" stop-color="#4a3018"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.5" stroke="#c9a24a" stroke-width="3">
    <line x1="230" y1="90" x2="230" y2="410"/>
    <line x1="570" y1="90" x2="570" y2="410"/>
  </g>
  <g transform="translate(300 300)">
    <rect x="-90" y="30" width="180" height="26" rx="3" fill="url(#book)" stroke="#c9a24a" stroke-width="1.5"/>
    <rect x="-80" y="4" width="160" height="26" rx="3" fill="url(#book)" stroke="#c9a24a" stroke-width="1.5"/>
    <rect x="-95" y="-22" width="190" height="26" rx="3" fill="url(#book)" stroke="#c9a24a" stroke-width="1.5"/>
  </g>
  <g transform="translate(500 200) rotate(-25)">
    <rect x="-70" y="-9" width="140" height="18" rx="6" fill="#5a4020" stroke="#e8c876" stroke-width="2"/>
    <rect x="55" y="-30" width="20" height="60" rx="6" fill="#3a2a10" stroke="#e8c876" stroke-width="2"/>
  </g>
  <circle cx="500" cy="330" r="6" fill="#e8c876"/>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f0dfb8">$1.5 BILLION SETTLEMENT</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#a68a52">482,000 BOOKS &#183; FEDERAL COURT APPROVAL</text>
</svg>