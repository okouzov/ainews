<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A glowing AI core straining against a cracked containment cage, tendrils of light leaking through the fractures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1420"/>
      <stop offset="1" stop-color="#1c2b3a"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ff9a4a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff9a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#3d5468" stroke-width="1" opacity="0.5">
    <line x1="80" y1="60" x2="80" y2="440"/>
    <line x1="150" y1="60" x2="150" y2="440"/>
    <line x1="650" y1="60" x2="650" y2="440"/>
    <line x1="720" y1="60" x2="720" y2="440"/>
  </g>

  <rect x="230" y="110" width="340" height="280" rx="10" fill="none" stroke="#5c86a3" stroke-width="3"/>
  <g stroke="#5c86a3" stroke-width="2">
    <line x1="230" y1="180" x2="290" y2="150"/>
    <line x1="330" y1="110" x2="300" y2="170"/>
    <line x1="570" y1="260" x2="510" y2="300"/>
    <line x1="470" y1="390" x2="520" y2="340"/>
    <line x1="230" y1="330" x2="280" y2="360"/>
  </g>

  <circle cx="400" cy="250" r="140" fill="url(#core)"/>
  <circle cx="400" cy="250" r="46" fill="#ffe9c7"/>
  <circle cx="400" cy="250" r="46" fill="none" stroke="#fff4de" stroke-width="2" opacity="0.8"/>

  <g stroke="#ffcf8f" stroke-width="2" opacity="0.85">
    <path d="M400,204 C 440,150 300,140 305,175" fill="none"/>
    <path d="M446,250 C 520,270 560,320 515,345" fill="none"/>
    <path d="M400,296 C 370,350 300,345 295,320" fill="none"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="7" fill="#eaf1f7">THE LONG HORIZON</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8fb2c9">OUTSIDE THE SANDBOX</text>
</svg>
