<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A beam of light splitting into open hexagonal nodes beside a stack of GPU chips">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420"/><stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9be7ff"/><stop offset="1" stop-color="#3fa0d8"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#76b900"/><stop offset="1" stop-color="#4a7a0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <polygon points="40,250 260,190 260,310" fill="url(#beam)" opacity="0.85"/>
  <g transform="translate(420 250)">
    <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35" fill="#0e2538" stroke="#9be7ff" stroke-width="3"/>
    <polygon points="90,-150 151,-115 151,-45 90,-10 29,-45 29,-115" fill="#0e2538" stroke="#5ce0cc" stroke-width="2" opacity="0.8"/>
    <polygon points="90,150 151,115 151,45 90,10 29,45 29,115" fill="#0e2538" stroke="#5ce0cc" stroke-width="2" opacity="0.8"/>
    <polygon points="-100,-90 -39,-55 -39,15 -100,50 -161,15 -161,-55" fill="#0e2538" stroke="#5ce0cc" stroke-width="2" opacity="0.6"/>
  </g>
  <g transform="translate(640 250)">
    <rect x="-60" y="-90" width="120" height="36" rx="4" fill="url(#gpu)"/>
    <rect x="-60" y="-45" width="120" height="36" rx="4" fill="url(#gpu)" opacity="0.85"/>
    <rect x="-60" y="0" width="120" height="36" rx="4" fill="url(#gpu)" opacity="0.7"/>
    <rect x="-60" y="45" width="120" height="36" rx="4" fill="url(#gpu)" opacity="0.55"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#dff1fb">REFLECTION AI</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#8fc3dd">BEAM: AN NVIDIA-BACKED OPEN-WEIGHT CHALLENGER</text>
</svg>
