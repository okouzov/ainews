<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="San Francisco skyline behind a striped barrier gate with a 45-day clock, dotted lines spreading to nearby cities">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a1e"/><stop offset="1" stop-color="#1d2228"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd0e0" stop-opacity="0.45"/><stop offset="1" stop-color="#5fd0e0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <g fill="#242a31" stroke="#5fd0e0" stroke-width="1.5">
    <rect x="160" y="200" width="46" height="110"/>
    <rect x="212" y="170" width="40" height="140"/>
    <rect x="258" y="210" width="46" height="100"/>
    <polygon points="330,130 352,310 308,310"/>
    <rect x="360" y="190" width="42" height="120"/>
    <rect x="408" y="160" width="36" height="150"/>
    <rect x="450" y="215" width="44" height="95"/>
  </g>
  <rect x="150" y="150" width="360" height="40" fill="url(#glow1)"/>
  <g transform="translate(120 330)">
    <rect x="0" y="0" width="560" height="16" fill="#3a2a1c" stroke="#e8956f" stroke-width="2"/>
    <rect x="0" y="0" width="560" height="16" fill="none" stroke="#e8956f" stroke-width="2" stroke-dasharray="22 16"/>
  </g>
  <g transform="translate(400 390)">
    <circle r="34" fill="#2b3346" stroke="#f2b880" stroke-width="3"/>
    <text x="0" y="9" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f2b880">45</text>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#f2b880" stroke-width="2"/>
    <line x1="0" y1="0" x2="14" y2="6" stroke="#f2b880" stroke-width="2"/>
  </g>
  <g stroke="#5fd0e0" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.8">
    <line x1="330" y1="310" x2="210" y2="400"/>
    <line x1="330" y1="310" x2="330" y2="420"/>
    <line x1="330" y1="310" x2="470" y2="410"/>
  </g>
  <g fill="#5fd0e0">
    <circle cx="210" cy="400" r="5"/>
    <circle cx="330" cy="420" r="5"/>
    <circle cx="470" cy="410" r="5"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="3" fill="#e6ecf7">SAN FRANCISCO PAUSES DATA CENTER GROWTH</text>
  <text x="400" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#8fa0b8">45-DAY MORATORIUM SPREADS ACROSS CALIFORNIA</text>
</svg>