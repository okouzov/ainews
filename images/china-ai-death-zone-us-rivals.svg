<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A scatter chart of AI models by capability and price with a shaded danger zone in the middle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f14"/><stop offset="1" stop-color="#2b1420"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cc4b4b" stop-opacity="0.35"/><stop offset="1" stop-color="#cc4b4b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#553244" stroke-width="1" opacity="0.8">
    <line x1="90" y1="90" x2="90" y2="380"/><line x1="90" y1="380" x2="720" y2="380"/>
  </g>
  <rect x="330" y="90" width="160" height="290" fill="url(#danger)"/>
  <text x="410" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="2" fill="#e8956f">DEATH ZONE</text>
  <g fill="#7fd6c2">
    <circle cx="160" cy="330" r="9"/>
    <circle cx="220" cy="300" r="9"/>
  </g>
  <text x="160" y="355" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#cfe8df">DeepSeek</text>
  <text x="220" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#cfe8df">Kimi K3</text>
  <g fill="#f2b880">
    <circle cx="260" cy="180" r="10"/>
  </g>
  <text x="260" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffdcb8">Qwen3.8-Max</text>
  <g fill="#e8956f">
    <circle cx="600" cy="150" r="10"/>
  </g>
  <text x="600" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#ffdcb8">Claude Fable 5</text>
  <text x="400" y="405" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a5879a">PRICE &#8594;</text>
  <text x="65" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a5879a" transform="rotate(-90 65 230)">CAPABILITY &#8594;</text>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="7" fill="#f0e2d6">CHINA&#8217;S AI SURGE</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#8f86b8">A DEATH ZONE FOR RIVALS</text>
</svg>
