<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Rising stock chart flowing into a heart shape representing charitable giving"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgAnthropicIpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1917"/><stop offset="1" stop-color="#2e2419"/>
    </linearGradient>
    <linearGradient id="barGoldIpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8c073"/><stop offset="1" stop-color="#a97f3f"/>
    </linearGradient>
    <radialGradient id="heartGlowIpo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e86f6f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e86f6f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgAnthropicIpo)"/>
  <g transform="translate(140,350)">
    <rect x="0" y="-40" width="54" height="40" fill="url(#barGoldIpo)"/>
    <rect x="70" y="-75" width="54" height="75" fill="url(#barGoldIpo)"/>
    <rect x="140" y="-120" width="54" height="120" fill="url(#barGoldIpo)"/>
    <rect x="210" y="-165" width="54" height="165" fill="url(#barGoldIpo)"/>
    <rect x="280" y="-210" width="54" height="210" fill="url(#barGoldIpo)"/>
    <line x1="-20" y1="0" x2="360" y2="0" stroke="#5a4a32" stroke-width="2"/>
  </g>
  <circle cx="560" cy="175" r="130" fill="url(#heartGlowIpo)"/>
  <g transform="translate(560,175)">
    <path d="M0 40 C-60 -5 -60 -70 -10 -70 C0 -70 0 -55 0 -55 C0 -55 0 -70 10 -70 C60 -70 60 -5 0 40 Z"
          fill="#2a1d1d" stroke="#e86f6f" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#f0c6c6">5%</text>
  </g>
  <path d="M420 300 C480 260 500 220 540 185" fill="none" stroke="#e8c073" stroke-width="3" stroke-dasharray="3 7" opacity="0.7"/>
  <path d="M460 320 L480 312 L472 332 Z" fill="#e8c073" opacity="0.7"/>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#f0e2d6">AN IPO FOR PHILANTHROPY</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#8fa0a8">ANTHROPIC'S WINDFALL COULD TOP $156B TO CHARITY</text>
</svg>