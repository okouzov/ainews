<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A rising bar chart of AI spending beside a sharply plunging cash flow line, over a dark indigo gradient">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f2b"/>
      <stop offset="1" stop-color="#241a3f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5c4aa8"/>
      <stop offset="1" stop-color="#9b7fe8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <g stroke="#3a2c5c" stroke-width="1" opacity="0.6">
    <line x1="0" y1="115" x2="800" y2="115"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
  </g>

  <g transform="translate(110 390)">
    <rect x="0" y="-40" width="46" height="40" fill="url(#bar)"/>
    <rect x="66" y="-80" width="46" height="80" fill="url(#bar)"/>
    <rect x="132" y="-135" width="46" height="135" fill="url(#bar)"/>
    <rect x="198" y="-210" width="46" height="210" fill="url(#bar)"/>
    <text x="122" y="-225" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#c8b8f5">AI CAPEX ^</text>
  </g>

  <g transform="translate(430 150)">
    <path d="M0 0 L60 10 L120 30 L180 160 L240 180" fill="none" stroke="#e88a8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="7" fill="#f2b6b6"/>
    <circle cx="240" cy="180" r="7" fill="#f2b6b6"/>
    <text x="120" y="-20" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#f2b6b6">FREE CASH FLOW v</text>
    <text x="240" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f2b6b6">-91%</text>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="4" fill="#ece5ff">SPENDING UP, CASH DOWN</text>
  <text x="400" y="479" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#a996d6">META Q2 2026 &#183; AI CAPEX $130-145B</text>
</svg>