<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A domed government building beside a circular thirty-day review clock, over a navy and gold gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1830"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#f2e3b8"/>
      <stop offset="1" stop-color="#c7a55c"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#2c3c66" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
  </g>

  <g transform="translate(230 380)">
    <ellipse cx="0" cy="-190" rx="34" ry="40" fill="url(#dome)"/>
    <rect x="-6" y="-232" width="12" height="24" fill="#c7a55c"/>
    <rect x="-90" y="-150" width="180" height="18" fill="#e9d9a8"/>
    <rect x="-78" y="-132" width="18" height="120" fill="#d9c48a"/>
    <rect x="-42" y="-132" width="18" height="120" fill="#d9c48a"/>
    <rect x="-6" y="-132" width="18" height="120" fill="#d9c48a"/>
    <rect x="30" y="-132" width="18" height="120" fill="#d9c48a"/>
    <rect x="66" y="-132" width="18" height="120" fill="#d9c48a"/>
    <rect x="-100" y="-12" width="200" height="12" fill="#c7a55c"/>
  </g>

  <g transform="translate(560 250)">
    <circle r="90" fill="#16233f" stroke="#5a719e" stroke-width="4"/>
    <path d="M0 -90 A90 90 0 0 1 78 -45" fill="none" stroke="#e8b155" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#dfe6ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="42" y2="20" stroke="#dfe6ff" stroke-width="6" stroke-linecap="round"/>
    <circle r="8" fill="#dfe6ff"/>
    <text x="0" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#e8b155">30 DAYS</text>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#e6ecff">VOLUNTARY REVIEW WINDOW</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8b9bc9">FRONTIER MODELS &#183; NO ENFORCEMENT MECHANISM</text>
</svg>
