<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Rows of GPU chip icons multiplying across a dark data center scene">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1a2b"/><stop offset="1" stop-color="#12222f"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0c8"/><stop offset="1" stop-color="#3fae86"/>
    </linearGradient>
    <linearGradient id="chip2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2b880"/><stop offset="1" stop-color="#d97f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <g opacity="0.5" stroke="#2c4256">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <g>
    <!-- existing (dim) row -->
    <g opacity="0.55">
      <rect x="120" y="140" width="46" height="46" rx="7" fill="url(#chip1)"/>
      <rect x="184" y="140" width="46" height="46" rx="7" fill="url(#chip1)"/>
      <rect x="248" y="140" width="46" height="46" rx="7" fill="url(#chip1)"/>
      <rect x="312" y="140" width="46" height="46" rx="7" fill="url(#chip1)"/>
    </g>
    <!-- doubled (bright) row -->
    <g>
      <rect x="440" y="140" width="46" height="46" rx="7" fill="url(#chip2)"/>
      <rect x="504" y="140" width="46" height="46" rx="7" fill="url(#chip2)"/>
      <rect x="568" y="140" width="46" height="46" rx="7" fill="url(#chip2)"/>
      <rect x="632" y="140" width="46" height="46" rx="7" fill="url(#chip2)"/>
    </g>
    <g opacity="0.55">
      <rect x="120" y="220" width="46" height="46" rx="7" fill="url(#chip1)"/>
      <rect x="184" y="220" width="46" height="46" rx="7" fill="url(#chip1)"/>
      <rect x="248" y="220" width="46" height="46" rx="7" fill="url(#chip1)"/>
      <rect x="312" y="220" width="46" height="46" rx="7" fill="url(#chip1)"/>
    </g>
    <g>
      <rect x="440" y="220" width="46" height="46" rx="7" fill="url(#chip2)"/>
      <rect x="504" y="220" width="46" height="46" rx="7" fill="url(#chip2)"/>
      <rect x="568" y="220" width="46" height="46" rx="7" fill="url(#chip2)"/>
      <rect x="632" y="220" width="46" height="46" rx="7" fill="url(#chip2)"/>
    </g>
  </g>
  <path d="M370 163 L430 163" stroke="#f2b880" stroke-width="3" marker-end="url(#arrow1)" opacity="0.9"/>
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f2b880"/>
    </marker>
  </defs>
  <text x="400" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#e7f2ec">COLOSSUS 2 GPU EXPANSION</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7ee0c8">XAI · NVIDIA · MEMPHIS</text>
</svg>