    <line x1="600" y1="105" x2="592" y2="105"/><line x1="600" y1="115" x2="592" y2="115"/>
    <line x1="630" y1="105" x2="638" y2="105"/><line x1="630" y1="115" x2="638" y2="115"/>
  </g>
