<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A DNA double helix intertwined with a glowing pill capsule, over a clinical red and white gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0e12"/>
      <stop offset="1" stop-color="#341018"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e35b5b"/>
      <stop offset="1" stop-color="#f4d8c8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#4a2028" stroke-width="1" opacity="0.6">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
  </g>

  <g stroke="#e8a1a1" stroke-width="4" fill="none" opacity="0.85">
    <path d="M310 120 C370 160 370 200 310 240 C250 280 250 320 310 360"/>
    <path d="M310 120 C250 160 250 200 310 240 C370 280 370 320 310 360"/>
  </g>
  <g stroke="#e8a1a1" stroke-width="3" opacity="0.7">
    <line x1="280" y1="140" x2="340" y2="140"/>
    <line x1="270" y1="180" x2="350" y2="180"/>
    <line x1="270" y1="220" x2="350" y2="220"/>
    <line x1="270" y1="260" x2="350" y2="260"/>
    <line x1="270" y1="300" x2="350" y2="300"/>
    <line x1="280" y1="340" x2="340" y2="340"/>
  </g>

  <g transform="translate(500 240) rotate(-30)">
