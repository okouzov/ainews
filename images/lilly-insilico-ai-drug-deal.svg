    <rect x="-90" y="-30" width="90" height="60" rx="30" fill="#c73e3e"/>
    <circle cx="-45" cy="0" r="6" fill="#fbe6dc"/>
    <circle cx="40" cy="0" r="6" fill="#fbe6dc"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="4" fill="#f5d9d9">AI DRUG DISCOVERY, $2.75B</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c98f8f">LILLY &#183; INSILICO &#183; LILLYPOD</text>
