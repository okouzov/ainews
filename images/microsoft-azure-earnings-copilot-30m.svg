<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A stock chart line breaking through a ceiling beside a Microsoft-style window icon and a 30 million seats counter">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1626"/><stop offset="1" stop-color="#132038"/>
    </linearGradient>
    <linearGradient id="line3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a7fc4"/><stop offset="1" stop-color="#7fe0c9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <line x1="90" y1="180" x2="480" y2="180" stroke="#3a4a6b" stroke-width="3" stroke-dasharray="8 6"/>
  <polyline points="90,340 160,320 220,300 280,260 340,230 400,150 460,90" fill="none" stroke="url(#line3)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="460,90 445,110 480,108" fill="#7fe0c9"/>
  <g transform="translate(600,150)">
    <rect x="0" y="0" width="42" height="42" rx="3" fill="#5fb0e8"/>
    <rect x="48" y="0" width="42" height="42" rx="3" fill="#8fa0d6"/>
    <rect x="0" y="48" width="42" height="42" rx="3" fill="#8fa0d6"/>
    <rect x="48" y="48" width="42" height="42" rx="3" fill="#f2b880"/>
  </g>
  <g transform="translate(560,300)">
    <rect x="-110" y="-45" width="220" height="90" rx="14" fill="#182642" opacity="0.9" stroke="#7fe0c9" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#7fe0c9">30M</text>
    <text x="0" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#bfe8e0">COPILOT SEATS</text>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#e9e2d0">MICROSOFT</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#8f9dc4">RECORD ONE-DAY GAIN ON AZURE, COPILOT GROWTH</text>
</svg>