    <circle cx="200" cy="325" r="7"/><circle cx="300" cy="325" r="7"/><circle cx="400" cy="325" r="7"/>
    <circle cx="500" cy="325" r="7"/><circle cx="600" cy="325" r="7"/>
  </g>
  <text x="200" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9be8c7">0.94</text>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#9be8c7">0.02</text>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#dff5ea">CALIBRATED DECISIONS</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fc9a4">A MODEL THAT NEVER GUESSES IN TEXT</text>
