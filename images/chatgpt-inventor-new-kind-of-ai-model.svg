<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A decision tree of glowing probability branches ending in calibrated dots">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a16"/><stop offset="1" stop-color="#123024"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be8c7"/><stop offset="1" stop-color="#2fa87a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <g stroke="#3f8a6a" stroke-width="2" opacity="0.75" fill="none">
    <path d="M400 110 L260 220 M400 110 L400 220 M400 110 L540 220"/>
    <path d="M260 220 L200 320 M260 220 L300 320"/>
    <path d="M400 220 L400 320"/>
    <path d="M540 220 L500 320 M540 220 L600 320"/>
  </g>
  <circle cx="400" cy="100" r="14" fill="url(#node)"/>
