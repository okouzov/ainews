<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A trust gauge with the needle swung deep into the distrust zone, beside a bar chart of declining trust percentages">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1210"/><stop offset="1" stop-color="#2c1a1a"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8845f"/><stop offset="1" stop-color="#d1495b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <g stroke="#3d2624" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>
  <g transform="translate(260 260)">
