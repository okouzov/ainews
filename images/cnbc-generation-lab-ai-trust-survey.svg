    <path d="M-110 20 A110 110 0 0 1 -20 -105" fill="none" stroke="#d1495b" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="10" x2="-70" y2="-60" stroke="url(#needle)" stroke-width="5" stroke-linecap="round"/>
    <circle r="9" fill="#e8845f"/>
  </g>
  <g transform="translate(520 320)">
    <rect x="0" y="-40" width="26" height="40" fill="#7a4a48"/>
    <rect x="40" y="-70" width="26" height="70" fill="#8f5250"/>
    <rect x="80" y="-100" width="26" height="100" fill="#d1495b"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#f2e0dc">TRUST IN AI LEADERS SLIPS</text>
