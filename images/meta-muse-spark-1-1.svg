      <stop offset="0" stop-color="#04142e"/>
      <stop offset="1" stop-color="#0a2a5e"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd0ff"/>
      <stop offset="0.5" stop-color="#3f8dff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f9bff" stop-opacity="0.6"/>
