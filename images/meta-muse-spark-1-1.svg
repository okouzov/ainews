  <path d="M120 235 q140 90 280 0 t280 0" fill="none" stroke="#7a5cff" stroke-width="1.6" opacity="0.45"/>

  <circle cx="400" cy="235" r="170" fill="url(#glow)"/>

  <path d="M425 105 L355 250 L398 250 L372 365 L462 210 L415 210 Z" fill="url(#bolt)" stroke="#cfe6ff" stroke-width="3" stroke-linejoin="round"/>

