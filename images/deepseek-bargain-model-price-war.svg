<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A steep downward price chart beside a small price tag reading a fraction of a cent">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1210"/><stop offset="1" stop-color="#132420"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0a0"/><stop offset="1" stop-color="#1f9e6b"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c14e"/><stop offset="1" stop-color="#c98a1f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <g transform="translate(90 90)">
    <line x1="0" y1="0" x2="0" y2="260" stroke="#3a5a4e" stroke-width="2"/>
    <line x1="0" y1="260" x2="380" y2="260" stroke="#3a5a4e" stroke-width="2"/>
    <rect x="20" y="20" width="46" height="240" fill="url(#bar)"/>
    <rect x="90" y="90" width="46" height="170" fill="url(#bar)" opacity="0.85"/>
    <rect x="160" y="170" width="46" height="90" fill="url(#bar)" opacity="0.7"/>
    <rect x="230" y="230" width="46" height="30" fill="url(#bar)" opacity="0.55"/>
    <rect x="300" y="252" width="46" height="8" fill="url(#bar)" opacity="0.4"/>
    <text x="43" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#cfeede">$25</text>
    <text x="323" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#cfeede">$0.28</text>
  </g>
  <g transform="translate(600 190) rotate(-18)">
    <path d="M0 0 L120 0 L150 30 L120 60 L0 60 Z" fill="url(#tag)"/>
    <circle cx="20" cy="30" r="7" fill="#0c1210"/>
    <text x="80" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#241a05">V4</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#dff2e6" font-variant="small-caps">DeepSeek's Race to Zero</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fc49a">V4 FLASH UNDERCUTS OPUS 4.8 ON PRICE</text>
</svg>