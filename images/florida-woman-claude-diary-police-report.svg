<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An open diary page beside a chat bubble with a warning flag, under a watchful eye icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f14"/><stop offset="1" stop-color="#301822"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e4d0"/><stop offset="1" stop-color="#cfc0a4"/>
    </linearGradient>
    <linearGradient id="flag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8956f"/><stop offset="1" stop-color="#d4432f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(230 260)">
    <rect x="-110" y="-140" width="220" height="280" rx="10" fill="url(#page)" transform="rotate(-6)"/>
    <g transform="rotate(-6)">
      <line x1="-80" y1="-90" x2="70" y2="-90" stroke="#9c8a68" stroke-width="3"/>
      <line x1="-80" y1="-60" x2="70" y2="-60" stroke="#9c8a68" stroke-width="3"/>
      <line x1="-80" y1="-30" x2="70" y2="-30" stroke="#9c8a68" stroke-width="3"/>
      <line x1="-80" y1="0" x2="40" y2="0" stroke="#9c8a68" stroke-width="3"/>
    </g>
  </g>
  <g transform="translate(540 230)">
    <path d="M-130 -70 h260 a20 20 0 0 1 20 20 v110 a20 20 0 0 1 -20 20 h-180 l-40 40 v-40 h-40 a20 20 0 0 1 -20 -20 v-110 a20 20 0 0 1 20 -20 z" fill="#123640" stroke="#5ce0cc" stroke-width="3"/>
    <polygon points="0,-30 14,-5 -14,-5" fill="url(#flag)"/>
    <rect x="-3" y="0" width="6" height="35" fill="url(#flag)"/>
    <circle cx="0" cy="48" r="4" fill="url(#flag)"/>
  </g>
  <g transform="translate(400 90)">
    <ellipse cx="0" cy="0" rx="46" ry="28" fill="#0e2538" stroke="#e8956f" stroke-width="3"/>
    <circle cx="0" cy="0" r="12" fill="#e8956f"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#f3e3e8">CLAUDE AS A DIARY</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#c79aa8">A FLAGGED ENTRY REACHES THE POLICE</text>
</svg>
