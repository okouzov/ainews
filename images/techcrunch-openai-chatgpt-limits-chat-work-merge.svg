<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Chat and Work lines merging into one usage gauge nearing its red zone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1a33"/><stop offset="1" stop-color="#1f2a5a"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#3a4a86" stroke-width="1"><line x1="70" y1="150" x2="730" y2="150"/><line x1="70" y1="250" x2="730" y2="250"/><line x1="70" y1="350" x2="730" y2="350"/></g>
  <line x1="90" y1="170" x2="430" y2="250" stroke="#5aa9ff" stroke-width="6" stroke-linecap="round"/>
