<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A donut chart with an amber wedge and a blue wedge sitting over a dark navy ring with a 28.4 percent figure at its center, representing Amazon and Google's combined ownership stake in Anthropic after its IPO">
  <defs>
    <linearGradient id="bgAG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <linearGradient id="amzAG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf7a"/><stop offset="1" stop-color="#d98a1f"/>
    </linearGradient>
    <linearGradient id="gooAG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb0ff"/><stop offset="1" stop-color="#3a6fd6"/>
    </linearGradient>
    <radialGradient id="glowAG" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#9fb6ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9fb6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgAG)"/>
  <ellipse cx="400" cy="215" rx="260" ry="210" fill="url(#glowAG)"/>
  <circle cx="400" cy="215" r="120" fill="none" stroke="#1c2740" stroke-width="46"/>
  <circle cx="400" cy="215" r="120" fill="none" stroke="url(#amzAG)" stroke-width="46" stroke-dasharray="110.8 643.2" transform="rotate(-90 400 215)"/>
  <circle cx="400" cy="215" r="120" fill="none" stroke="url(#gooAG)" stroke-width="46" stroke-dasharray="103.3 650.7" stroke-dashoffset="-110.8" transform="rotate(-90 400 215)"/>
  <circle cx="400" cy="215" r="90" fill="#0b0f1a"/>
  <text x="400" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#efe1c3">28.4%</text>
  <text x="400" y="236" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2" fill="#b99a66">COMBINED STAKE</text>
  <circle cx="260" cy="400" r="9" fill="url(#amzAG)"/>
  <text x="278" y="405" font-family="Georgia, serif" font-size="15" fill="#efe1c3">AMAZON 14.7%</text>
  <circle cx="470" cy="400" r="9" fill="url(#gooAG)"/>
  <text x="488" y="405" font-family="Georgia, serif" font-size="15" fill="#efe1c3">GOOGLE 13.7%</text>
  <text x="400" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#9fb6d9">SLICING THE CAP TABLE</text>
  <text x="400" y="458" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="3" fill="#efe1c3">ANTHROPIC'S BIGGEST SHAREHOLDERS</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#9fb6d9">AMAZON AND GOOGLE'S STAKE AFTER THE IPO</text>
</svg>