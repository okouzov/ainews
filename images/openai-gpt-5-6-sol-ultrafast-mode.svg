<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A lightning bolt over a speed gauge and a chip, illustrating fourteen times faster inference at 750 tokens per second">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1420"/><stop offset="1" stop-color="#1c2440"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2b880"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#2c3763" stroke-width="1" opacity="0.6">
    <path d="M120 380 A280 280 0 0 1 680 380" fill="none"/>
    <path d="M170 380 A230 230 0 0 1 630 380" fill="none" stroke-dasharray="3 8"/>
  </g>
  <g stroke="#6c7fd6" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="230" x2="205" y2="255"/>
    <line x1="400" y1="150" x2="400" y2="185"/>
    <line x1="620" y1="230" x2="595" y2="255"/>
  </g>
  <line x1="400" y1="380" x2="565" y2="255" stroke="#f2b880" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="380" r="10" fill="#f2b880"/>
  <path d="M430 130 L370 260 L410 260 L360 380 L470 220 L425 220 Z" fill="url(#bolt)" stroke="#c98a4a" stroke-width="2"/>
  <g transform="translate(560 300)" stroke="#7fd9d1" stroke-width="2" opacity="0.85">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#101a2e"/>
    <line x1="14" y1="0" x2="14" y2="-10"/><line x1="34" y1="0" x2="34" y2="-10"/><line x1="54" y1="0" x2="54" y2="-10"/>
    <line x1="14" y1="70" x2="14" y2="80"/><line x1="34" y1="70" x2="34" y2="80"/><line x1="54" y1="70" x2="54" y2="80"/>
    <line x1="0" y1="14" x2="-10" y2="14"/><line x1="0" y1="34" x2="-10" y2="34"/><line x1="0" y1="54" x2="-10" y2="54"/>
    <line x1="70" y1="14" x2="80" y2="14"/><line x1="70" y1="34" x2="80" y2="34"/><line x1="70" y1="54" x2="80" y2="54"/>
  </g>
  <text x="595" y="342" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#7fd9d1">CS</text>
  <text x="140" y="150" font-family="Georgia, serif" font-size="30" fill="#f0e2d6">14&#215;</text>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f0e2d6">GPT-5.6 SOL &#183; ULTRAFAST</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8fa0d6">750 TOK/S &#183; CEREBRAS POWERED</text>
</svg>
