  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="4" fill="#f0e2d6">GAMBLING WITH OUR LIVES</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a99bd6">A RESEARCHER&#8217;S RESIGNATION</text>
