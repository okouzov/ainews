<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A lone silhouette walking away through an open doorway of warm light, with a jagged warning crack across the dark sky, representing a researcher resigning over AI safety fears">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120e18"/><stop offset="1" stop-color="#241522"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#cc785c" stop-opacity="0.45"/><stop offset="1" stop-color="#cc785c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b880"/><stop offset="1" stop-color="#cc785c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="420" cy="230" r="230" fill="url(#glow)"/>
  <g stroke="#3a2a3c" stroke-width="2" opacity="0.6">
    <line x1="0" y1="60" x2="800" y2="40"/>
    <line x1="0" y1="100" x2="800" y2="130"/>
  </g>
  <path d="M300 90 L340 150 L310 190 L360 250" fill="none" stroke="#e8956f" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <rect x="330" y="150" width="150" height="230" fill="url(#door)" opacity="0.92"/>
  <rect x="330" y="150" width="150" height="230" fill="none" stroke="#160c0a" stroke-width="6"/>
  <g fill="#1a1017">
    <circle cx="410" cy="330" r="60"/>
    <rect x="380" y="330" width="60" height="70"/>
    <path d="M380 330 a30 30 0 0 1 60 0 z"/>
  </g>
  <g fill="#160c0a">
