  <line x1="250" y1="210" x2="550" y2="250" stroke="url(#beamHJ)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="400" cy="230" r="10" fill="#f3e3bf"/>
  <line x1="250" y1="210" x2="250" y2="300" stroke="#6b5230" stroke-width="4"/>
  <line x1="550" y1="250" x2="550" y2="330" stroke="#6b5230" stroke-width="4"/>
  <path d="M190 300 h120 l-20 48 h-80 z" fill="none" stroke="#6b5230" stroke-width="4"/>
  <path d="M490 330 h120 l-20 48 h-80 z" fill="none" stroke="#6b5230" stroke-width="4"/>
