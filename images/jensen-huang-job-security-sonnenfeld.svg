    <radialGradient id="glowHJ" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#f3e3bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3e3bf" stop-opacity="0"/>
