      <stop offset="0" stop-color="#0c0f1a"/><stop offset="1" stop-color="#241a10"/>
    </linearGradient>
    <linearGradient id="beamHJ" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b06a"/><stop offset="1" stop-color="#9c7a42"/>
    </linearGradient>
    <linearGradient id="chipHJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fae5c"/><stop offset="1" stop-color="#4c6b2c"/>
