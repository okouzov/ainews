  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#efe1c3">A LEADER ON THE SCALE</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#b99a66">YALE PROFESSOR PUTS THE ODDS AT 50-50</text>
