<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A stack of newspapers beneath a gavel about to strike">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15181f"/><stop offset="1" stop-color="#22283a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(400 300)">
    <rect x="-130" y="30" width="260" height="14" rx="3" fill="#cfd4e4"/>
    <rect x="-118" y="12" width="236" height="14" rx="3" fill="#b7bdd4"/>
    <rect x="-106" y="-6" width="212" height="14" rx="3" fill="#9aa0c0"/>
    <g font-family="Georgia, serif" font-size="11" fill="#2a2e3d">
      <text x="-96" y="4">USA TODAY</text>
      <text x="40" y="4">AI AND THE NEWS</text>
    </g>
  </g>
  <g transform="translate(400 150)" stroke="url(#gold)" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="0" y1="-30" x2="0" y2="40"/>
    <line x1="-55" y1="-30" x2="55" y2="-30"/>
    <rect x="-70" y="40" width="140" height="16" rx="4" fill="url(#gold)" stroke="none"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="2" fill="#e8ebf5">USA TODAY SUES OPENAI</text>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#aab0ca">SEEKS OVER $250 MILLION IN DAMAGES</text>
</svg>