<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A downward traffic graph draining into an AI answer box, away from website icons">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/><stop offset="1" stop-color="#1c2c4a"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ab0ff"/><stop offset="1" stop-color="#2a6fd6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc1ff"/><stop offset="1" stop-color="#3f6fa8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.85">
    <rect x="110" y="300" width="46" height="90" fill="url(#bar)"/>
    <rect x="190" y="330" width="46" height="60" fill="url(#bar)" opacity="0.85"/>
    <rect x="270" y="355" width="46" height="35" fill="url(#bar)" opacity="0.7"/>
    <rect x="350" y="372" width="46" height="18" fill="url(#bar)" opacity="0.55"/>
  </g>
  <path d="M110 300 Q250 260 396 380" fill="none" stroke="#ff9d7a" stroke-width="3" stroke-dasharray="2 6"/>
  <polygon points="396,380 384,368 400,364" fill="#ff9d7a"/>
  <rect x="480" y="150" width="220" height="120" rx="14" fill="url(#box)" stroke="#173a66" stroke-width="3"/>
  <g fill="#0e1626">
    <rect x="504" y="180" width="170" height="10" rx="4" opacity="0.6"/>
    <rect x="504" y="202" width="140" height="10" rx="4" opacity="0.5"/>
    <rect x="504" y="224" width="155" height="10" rx="4" opacity="0.4"/>
  </g>
  <text x="590" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#0e2447" opacity="0.7">AI OVERVIEW</text>
  <g fill="none" stroke="#8fc1ff" stroke-width="2" opacity="0.5">
    <rect x="150" y="420" width="34" height="34" rx="4"/>
    <rect x="230" y="420" width="34" height="34" rx="4"/>
    <rect x="310" y="420" width="34" height="34" rx="4"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#dcebff">TRAFFIC DRAIN</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fa3d6">GOOGLE &#183; AI OVERVIEWS</text>
</svg>