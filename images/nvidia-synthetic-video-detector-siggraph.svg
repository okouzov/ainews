<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A video frame with a scanning line and a shield check mark, next to a 22 millisecond label">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08120c"/><stop offset="1" stop-color="#0d2318"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c3a2c"/><stop offset="1" stop-color="#10261a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76f2a8" stop-opacity="0"/><stop offset="0.5" stop-color="#76f2a8" stop-opacity="0.9"/><stop offset="1" stop-color="#76f2a8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <rect x="120" y="110" width="360" height="230" rx="10" fill="url(#frame)" stroke="#3a6a4e" stroke-width="2"/>
  <polygon points="240,180 240,270 320,225" fill="#254a36"/>
  <rect x="120" y="215" width="360" height="10" fill="url(#scan)"/>
  <g transform="translate(300 260)">
    <path d="M0 -60 L52 -30 L52 20 A52 70 0 0 1 0 80 A52 70 0 0 1 -52 20 L-52 -30 Z" fill="#173a26" stroke="#4fd68a" stroke-width="3"/>
    <path d="M-22 6 L-4 26 L28 -18" fill="none" stroke="#4fd68a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(610 220)">
    <rect x="-90" y="-55" width="180" height="110" rx="14" fill="#123322" opacity="0.9"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#76f2a8">22ms</text>
    <text x="0" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#b9e8cd">DETECTION LATENCY</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#e2f5ea" font-variant="small-caps">Nvidia Flags Synthetic Video</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fc49a">NIM DETECTOR DEBUTS AT SIGGRAPH 2026</text>
</svg>