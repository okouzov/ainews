<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Rays of light converging into a single bright point, a singularity">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060414"/>
      <stop offset="1" stop-color="#1c1140"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffe6a1"/>
      <stop offset="1" stop-color="#ff7edb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a97dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a97dff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky5)"/>
  <g fill="#e8e6ff">
    <circle cx="50" cy="60" r="1.4"/><circle cx="120" cy="120" r="1"/>
    <circle cx="700" cy="70" r="1.3"/><circle cx="760" cy="140" r="1"/>
    <circle cx="40" cy="400" r="1.2"/><circle cx="760" cy="420" r="1.1"/>
    <circle cx="200" cy="440" r="0.9"/><circle cx="600" cy="440" r="0.9"/>
  </g>
  <circle cx="400" cy="230" r="220" fill="url(#haze)"/>
  <g stroke="#c9a9ff" stroke-width="1.2" opacity="0.55">
    <line x1="60" y1="60" x2="400" y2="230"/>
    <line x1="740" y1="60" x2="400" y2="230"/>
    <line x1="60" y1="400" x2="400" y2="230"/>
    <line x1="740" y1="400" x2="400" y2="230"/>
    <line x1="400" y1="30" x2="400" y2="230"/>
    <line x1="400" y1="430" x2="400" y2="230"/>
    <line x1="140" y1="230" x2="400" y2="230"/>
    <line x1="660" y1="230" x2="400" y2="230"/>
  </g>
  <g fill="#ffe6a1" opacity="0.85">
    <circle cx="60" cy="60" r="2.2"/><circle cx="740" cy="60" r="2.2"/>
    <circle cx="60" cy="400" r="2.2"/><circle cx="740" cy="400" r="2.2"/>
    <circle cx="400" cy="30" r="2.2"/><circle cx="400" cy="430" r="2.2"/>
    <circle cx="140" cy="230" r="2.2"/><circle cx="660" cy="230" r="2.2"/>
  </g>
  <circle cx="400" cy="230" r="60" fill="url(#core)"/>
  <circle cx="400" cy="230" r="20" fill="#fffef2"/>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="7" fill="#f0e6c8">THE SINGULARITY</text>
  <text x="400" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="5" fill="#c9a9ff">INTELLIGENCE EXPLOSION</text>
</svg>