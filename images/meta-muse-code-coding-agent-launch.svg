<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A terminal window branching into several parallel glowing code panels">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1420"/><stop offset="1" stop-color="#131f30"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a3e"/><stop offset="1" stop-color="#101a28"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="60" y="150" width="220" height="150" rx="8" fill="url(#panel)" stroke="#3a5a7a" stroke-width="2"/>
  <circle cx="80" cy="168" r="5" fill="#e06c5a"/><circle cx="96" cy="168" r="5" fill="#e0c05a"/><circle cx="112" cy="168" r="5" fill="#6ec98a"/>
  <g stroke="#4fd3a8" stroke-width="3" opacity="0.9">
    <line x1="80" y1="195" x2="150" y2="195"/><line x1="80" y1="212" x2="210" y2="212"/>
    <line x1="80" y1="229" x2="170" y2="229"/><line x1="80" y1="246" x2="230" y2="246"/>
  </g>
  <g stroke="#4a7cae" stroke-width="2" fill="none" opacity="0.7">
    <path d="M280 200 L470 130"/><path d="M280 225 L470 240"/><path d="M280 250 L470 350"/>
  </g>
  <g fill="url(#panel)" stroke="#2f4a66" stroke-width="1.5">
    <rect x="480" y="90" width="170" height="90" rx="6"/>
    <rect x="480" y="200" width="170" height="90" rx="6"/>
    <rect x="480" y="310" width="170" height="90" rx="6"/>
  </g>
  <g stroke="#7fd8c0" stroke-width="2.5" opacity="0.85">
    <line x1="500" y1="115" x2="560" y2="115"/><line x1="500" y1="132" x2="620" y2="132"/><line x1="500" y1="149" x2="590" y2="149"/>
    <line x1="500" y1="225" x2="600" y2="225"/><line x1="500" y1="242" x2="560" y2="242"/><line x1="500" y1="259" x2="630" y2="259"/>
    <line x1="500" y1="335" x2="580" y2="335"/><line x1="500" y1="352" x2="620" y2="352"/><line x1="500" y1="369" x2="550" y2="369"/>
  </g>
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#dfeeee">MUSE CODE</text>
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fa8b0">META&#8217;S FIRST AI CODING AGENT</text>
</svg>