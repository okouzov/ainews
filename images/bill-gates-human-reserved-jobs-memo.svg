    <text x="0" y="6" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#08201a">40%</text>
    <text x="0" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#0c2a20">HUMAN RESERVED</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f0e6c8">BILL GATES · THE AI JOBS MEMO</text>
  <text x="400" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#8f97c9">HUMAN RESERVED WORK AND A TAX ON AI TOKENS</text>
