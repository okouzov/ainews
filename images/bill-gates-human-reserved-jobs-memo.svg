<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A human figure and a robot arm on a balance beam with a forty percent shield">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#241a2e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ee8b8"/><stop offset="1" stop-color="#1f8a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf66" stop-opacity="0.3"/><stop offset="1" stop-color="#ffcf66" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="210" r="220" fill="url(#glow)"/>
  <line x1="400" y1="120" x2="400" y2="330" stroke="#5a6b92" stroke-width="6" stroke-linecap="round"/>
  <path d="M360 330 h80 l16 30 h-112 z" fill="#3a3f5c"/>
  <line x1="180" y1="150" x2="620" y2="150" stroke="#8a93bf" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#8a93bf" stroke-width="2">
    <line x1="200" y1="150" x2="200" y2="210"/><line x1="240" y1="150" x2="240" y2="210"/>
    <line x1="560" y1="150" x2="560" y2="210"/><line x1="600" y1="150" x2="600" y2="210"/>
  </g>
  <path d="M170 210 h100 l-14 34 h-72 z" fill="#26324e" stroke="#7f8fc0" stroke-width="2"/>
  <path d="M530 210 h100 l-14 34 h-72 z" fill="#26324e" stroke="#7f8fc0" stroke-width="2"/>
  <g transform="translate(220 180)" fill="#ffe6a1">
    <circle cx="0" cy="-6" r="12"/>
