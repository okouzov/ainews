<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An open gift box releasing a branching open source network above a maintainers headcount label">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0f1c"/><stop offset="1" stop-color="#1a1830"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0733f"/><stop offset="1" stop-color="#b0472a"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d8a8"/><stop offset="1" stop-color="#d9a760"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <g stroke="#5a5486" stroke-width="1.4" opacity="0.7">
    <line x1="400" y1="230" x2="260" y2="140"/>
    <line x1="400" y1="230" x2="400" y2="120"/>
    <line x1="400" y1="230" x2="540" y2="140"/>
    <line x1="260" y1="140" x2="180" y2="90"/>
    <line x1="260" y1="140" x2="240" y2="80"/>
    <line x1="540" y1="140" x2="560" y2="80"/>
    <line x1="540" y1="140" x2="620" y2="90"/>
  </g>
  <g fill="#e8b878">
    <circle cx="260" cy="140" r="8"/><circle cx="400" cy="120" r="8"/><circle cx="540" cy="140" r="8"/>
    <circle cx="180" cy="90" r="6"/><circle cx="240" cy="80" r="6"/><circle cx="560" cy="80" r="6"/><circle cx="620" cy="90" r="6"/>
  </g>
  <g transform="translate(400 300)">
    <rect x="-90" y="0" width="180" height="110" rx="6" fill="url(#box)"/>
    <path d="M-90 0 L0 -50 L90 0 Z" fill="#f2925c"/>
    <rect x="-14" y="-50" width="28" height="160" fill="url(#ribbon)"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#efe8f5" font-variant="small-caps">A Gift for Maintainers</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a89ad6">FREE CLAUDE MAX 20X FOR 10,000 OSS DEVS</text>
</svg>