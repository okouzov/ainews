<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A grapevine leaf with a computer-vision bounding box, next to a clock shrinking from a month to fifteen minutes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10160f"/><stop offset="1" stop-color="#1c2818"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cb86a"/><stop offset="1" stop-color="#4a8a44"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#2c3d28" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>
  <g transform="translate(230 260)">
    <path d="M0 -90 Q80 -70 90 0 Q80 70 0 100 Q-80 70 -90 0 Q-80 -70 0 -90 Z" fill="url(#leaf)"/>
    <path d="M0 -80 L0 90 M0 -20 L-55 -50 M0 -20 L55 -50 M0 30 L-60 10 M0 30 L60 10" stroke="#2e5a28" stroke-width="3" fill="none"/>
    <rect x="-100" y="-100" width="200" height="200" rx="8" fill="none" stroke="#dff2d0" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="-100" cy="-100" r="5" fill="#dff2d0"/><circle cx="100" cy="-100" r="5" fill="#dff2d0"/>
    <circle cx="-100" cy="100" r="5" fill="#dff2d0"/><circle cx="100" cy="100" r="5" fill="#dff2d0"/>
  </g>
  <g transform="translate(520 190)">
    <circle r="60" fill="#232f22" stroke="#5a6a52" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-40" stroke="#dff2d0" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="30" y2="10" stroke="#dff2d0" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="86" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#a8c69a">1 MONTH</text>
  </g>
  <text x="622" y="196" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#dff2d0">&#8594;</text>
  <g transform="translate(690 260)">
    <circle r="34" fill="#2c4a26" stroke="#9fe870" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#dff2d0" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="16" y2="6" stroke="#dff2d0" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c0e8a8">15 MIN</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#e6f2dd">SYNAPS-I AT BERKELEY LAB</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8fae7a">META OPEN MODELS &#183; GENESIS MISSION</text>
</svg>
