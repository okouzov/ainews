<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An office chair sliding out through a doorway past three name badges, two crossed out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161f"/><stop offset="1" stop-color="#241c26"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3348"/><stop offset="1" stop-color="#241f30"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#3a3550" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>
  <rect x="330" y="110" width="200" height="300" rx="6" fill="url(#door)" stroke="#544a68" stroke-width="4"/>
  <rect x="350" y="130" width="160" height="260" rx="4" fill="#0f0d16"/>
  <circle cx="480" cy="260" r="6" fill="#c9a86a"/>
  <g transform="translate(500 300)">
    <rect x="-40" y="-10" width="80" height="14" rx="6" fill="#8f9bd8"/>
    <rect x="-30" y="-70" width="60" height="60" rx="10" fill="#8f9bd8"/>
    <line x1="-30" y1="4" x2="-46" y2="46" stroke="#5c6ab0" stroke-width="6" stroke-linecap="round"/>
    <line x1="30" y1="4" x2="46" y2="46" stroke="#5c6ab0" stroke-width="6" stroke-linecap="round"/>
    <line x1="-8" y1="4" x2="-14" y2="46" stroke="#5c6ab0" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="4" x2="14" y2="46" stroke="#5c6ab0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g stroke="#8f9bd8" stroke-width="2" stroke-dasharray="3 6" opacity="0.7">
    <line x1="560" y1="270" x2="620" y2="270"/>
    <line x1="560" y1="300" x2="630" y2="300"/>
    <line x1="560" y1="330" x2="615" y2="330"/>
  </g>
  <g font-family="Georgia, serif" text-anchor="middle">
    <g transform="translate(180 160)">
      <circle r="30" fill="#2a2436" stroke="#6a5c86" stroke-width="2"/>
      <text y="5" font-size="13" fill="#a89ac0">SACKS</text>
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="#c96a5c" stroke-width="3"/>
      <line x1="-22" y1="22" x2="22" y2="-22" stroke="#c96a5c" stroke-width="3"/>
    </g>
    <g transform="translate(255 215)">
      <circle r="26" fill="#2a2436" stroke="#6a5c86" stroke-width="2"/>
      <text y="4" font-size="11" fill="#a89ac0">BURNS</text>
      <line x1="-19" y1="-19" x2="19" y2="19" stroke="#c96a5c" stroke-width="3"/>
      <line x1="-19" y1="19" x2="19" y2="-19" stroke="#c96a5c" stroke-width="3"/>
    </g>
    <g transform="translate(220 300)">
      <circle r="34" fill="#3a3350" stroke="#e8956f" stroke-width="3"/>
      <text y="6" font-size="15" fill="#f0e2d6">FALL</text>
    </g>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="6" fill="#f0e2d6">AI CZAR, VACANT AGAIN</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#9a8cb0">THIRD EXIT IN UNDER A YEAR</text>
</svg>
