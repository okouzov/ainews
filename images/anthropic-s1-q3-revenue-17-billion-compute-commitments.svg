      <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#17283a"/>
    </linearGradient>
    <linearGradient id="revA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd4c1"/><stop offset="1" stop-color="#2f7d6b"/>
    </linearGradient>
    <linearGradient id="comA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c98a"/><stop offset="1" stop-color="#b5692a"/>
