<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A coiled protein ribbon that unravels into scattered fragments, over a deep teal gradient" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f22"/>
      <stop offset="1" stop-color="#153436"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd6c4"/>
      <stop offset="1" stop-color="#2f8f8c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <g stroke="#1f4a4a" stroke-width="1" opacity="0.6">
    <line x1="0" y1="115" x2="800" y2="115"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
  </g>

  <path d="M120 180 C 200 100, 280 100, 320 180 C 360 260, 300 300, 340 340" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round"/>
  <path d="M140 200 C 210 130, 270 130, 305 195 C 340 260, 290 295, 325 330" fill="none" stroke="#0c1f22" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>

  <g fill="#5fd6c4" opacity="0.9">
    <circle cx="470" cy="150" r="9"/>
    <circle cx="520" cy="200" r="6"/>
    <circle cx="560" cy="140" r="5"/>
    <circle cx="610" cy="215" r="8"/>
    <circle cx="650" cy="160" r="5"/>
    <circle cx="500" cy="260" r="6"/>
    <circle cx="600" cy="290" r="7"/>
    <circle cx="680" cy="240" r="5"/>
  </g>
  <g stroke="#2f8f8c" stroke-width="2" opacity="0.5">
    <line x1="470" y1="150" x2="520" y2="200"/>
    <line x1="520" y1="200" x2="560" y2="140"/>
    <line x1="560" y1="140" x2="610" y2="215"/>
    <line x1="610" y1="215" x2="650" y2="160"/>
    <line x1="500" y1="260" x2="600" y2="290"/>
    <line x1="600" y1="290" x2="680" y2="240"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="4" fill="#e6fff9">ALPHAFOLD TEAM DISBANDED</text>
  <text x="400" y="479" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#7fbdb6">RESEARCHERS SCATTER TO GEMINI, ISOMORPHIC LABS, ANTHROPIC</text>
</svg>