<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A television screen with an abstract synthetic anchor silhouette, a live indicator and a viewer count">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170e22"/><stop offset="1" stop-color="#2a1330"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a3d"/><stop offset="1" stop-color="#150f24"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="150" y="80" width="500" height="300" rx="14" fill="url(#screen)" stroke="#5c4a86" stroke-width="3"/>
  <g stroke="#3a2c5c" stroke-width="1" opacity="0.6">
    <line x1="150" y1="140" x2="650" y2="140"/><line x1="150" y1="200" x2="650" y2="200"/>
    <line x1="150" y1="260" x2="650" y2="260"/><line x1="150" y1="320" x2="650" y2="320"/>
  </g>
  <circle cx="400" cy="230" r="70" fill="#3a2c5c" opacity="0.7"/>
  <circle cx="400" cy="200" r="34" fill="#e8b98f"/>
