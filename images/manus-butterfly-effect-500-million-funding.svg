<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A butterfly silhouette above a rising bar chart of coins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2420"/><stop offset="1" stop-color="#11433a"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd6b0"/><stop offset="1" stop-color="#1f8f72"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3f9e78"/><stop offset="1" stop-color="#9ff0c8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(330 190)">
    <path d="M0 0 C-60 -70 -150 -50 -150 10 C-150 60 -80 70 0 20 Z" fill="url(#wing)"/>
    <path d="M0 0 C60 -70 150 -50 150 10 C150 60 80 70 0 20 Z" fill="url(#wing)" opacity="0.85"/>
    <path d="M0 0 C-40 20 -90 40 -90 80 C-90 110 -50 110 0 70 Z" fill="url(#wing)" opacity="0.7"/>
    <path d="M0 0 C40 20 90 40 90 80 C90 110 50 110 0 70 Z" fill="url(#wing)" opacity="0.6"/>
    <ellipse cx="0" cy="10" rx="7" ry="40" fill="#0a2420"/>
  </g>
  <g fill="url(#coin)">
    <rect x="470" y="330" width="40" height="40" rx="20"/>
    <rect x="520" y="300" width="40" height="70" rx="20"/>
    <rect x="570" y="260" width="40" height="110" rx="20"/>
    <rect x="620" y="210" width="40" height="160" rx="20"/>
  </g>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="2" fill="#dff5eb">MANUS MAKER RAISES $500 MILLION</text>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#8fd6bc">FIRST ROUND SINCE META DEAL COLLAPSED</text>
