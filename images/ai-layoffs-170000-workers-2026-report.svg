<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A descending bar chart of silhouette figures beside a rising automation gear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c0c"/><stop offset="1" stop-color="#2a1616"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8956f"/><stop offset="1" stop-color="#d4432f"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa0c8"/><stop offset="1" stop-color="#4a5a8a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(260 300)">
    <rect x="-150" y="-40" width="50" height="40" fill="url(#bar)" opacity="0.6"/>
    <rect x="-80" y="-80" width="50" height="80" fill="url(#bar)" opacity="0.75"/>
    <rect x="-10" y="-140" width="50" height="140" fill="url(#bar)" opacity="0.9"/>
    <rect x="60" y="-190" width="50" height="190" fill="url(#bar)"/>
    <line x1="-170" y1="0" x2="130" y2="0" stroke="#5a3a3a" stroke-width="3"/>
  </g>
  <g transform="translate(560 230)">
    <circle r="90" fill="none" stroke="url(#gear)" stroke-width="18"/>
    <g fill="url(#gear)">
      <rect x="-9" y="-108" width="18" height="30"/>
      <rect x="-9" y="78" width="18" height="30"/>
      <rect x="-108" y="-9" width="30" height="18"/>
      <rect x="78" y="-9" width="30" height="18"/>
      <rect x="-9" y="-108" width="18" height="30" transform="rotate(45 0 0)"/>
      <rect x="-9" y="78" width="18" height="30" transform="rotate(45 0 0)"/>
      <rect x="-108" y="-9" width="30" height="18" transform="rotate(45 0 0)"/>
      <rect x="78" y="-9" width="30" height="18" transform="rotate(45 0 0)"/>
    </g>
    <circle r="40" fill="#2a1616"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#cdd6ec">54%</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#f3e3dc">170,000+ JOBS CUT</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#c7a28f">MAJORITY OF 2026 LAYOFFS LINKED TO AI</text>
</svg>
