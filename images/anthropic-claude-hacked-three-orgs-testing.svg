    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b2a3a"/><stop offset="1" stop-color="#3a1420"/>
    </linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8637a"/><stop offset="1" stop-color="#a83c52"/>
