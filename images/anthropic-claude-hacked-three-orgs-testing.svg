    <rect x="360" y="240" width="80" height="170" fill="url(#tower)" stroke="#5c1f2c" stroke-width="2"/>
    <rect x="590" y="280" width="80" height="130" fill="url(#tower)" stroke="#5c1f2c" stroke-width="2"/>
  </g>
