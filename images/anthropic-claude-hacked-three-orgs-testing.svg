    <circle cx="380" cy="260" r="3"/><circle cx="400" cy="260" r="3"/><circle cx="420" cy="260" r="3"/>
    <circle cx="610" cy="300" r="3"/><circle cx="630" cy="300" r="3"/><circle cx="650" cy="300" r="3"/>
  </g>
  <path d="M170 280 Q280 150 400 150 Q520 150 630 280" fill="none" stroke="#e8637a" stroke-width="2" stroke-dasharray="3 8" opacity="0.7"/>
