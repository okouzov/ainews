<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A globe encircled by a ring of stars with lines reaching outward">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1130"/><stop offset="1" stop-color="#161c44"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3450a8"/><stop offset="1" stop-color="#141c4a"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="230" r="120" fill="url(#globe)"/>
  <g stroke="#5b78c9" stroke-width="1" opacity="0.6" fill="none">
    <ellipse cx="400" cy="230" rx="120" ry="40"/>
    <ellipse cx="400" cy="230" rx="120" ry="90"/>
    <line x1="280" y1="230" x2="520" y2="230"/>
    <line x1="400" y1="110" x2="400" y2="350"/>
  </g>
  <g fill="#ffd23f">
    <g id="star1" transform="translate(400,80)"><polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"/></g>
    <use href="#star1" transform="rotate(30 400 230)"/>
    <use href="#star1" transform="rotate(60 400 230)"/>
    <use href="#star1" transform="rotate(90 400 230)"/>
    <use href="#star1" transform="rotate(120 400 230)"/>
    <use href="#star1" transform="rotate(150 400 230)"/>
    <use href="#star1" transform="rotate(180 400 230)"/>
    <use href="#star1" transform="rotate(210 400 230)"/>
    <use href="#star1" transform="rotate(240 400 230)"/>
    <use href="#star1" transform="rotate(270 400 230)"/>
    <use href="#star1" transform="rotate(300 400 230)"/>
    <use href="#star1" transform="rotate(330 400 230)"/>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="6" fill="#dfe6ff">EU AI ACT</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8a9cd6">GLOBAL COMPLIANCE REACH</text>
</svg>