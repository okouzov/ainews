<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A humanoid robot silhouette beside a soaring stock chart line, with a badge reading plus six hundred twenty nine percent, in red and gold tones evoking the Shanghai market debut">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160b0c"/><stop offset="1" stop-color="#2c1210"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0483f" stop-opacity="0.5"/><stop offset="1" stop-color="#e0483f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b45a"/><stop offset="1" stop-color="#f2d38a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="220" fill="url(#glow)"/>
  <g stroke="#5a2e28" stroke-width="1" opacity="0.5">
    <line x1="0" y1="90" x2="800" y2="90"/><line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="330" x2="800" y2="330"/><line x1="0" y1="410" x2="800" y2="410"/>
  </g>
  <polyline points="90,400 190,375 260,390 330,300 400,320 470,190 540,220 610,110 690,80" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <g fill="#f2d38a">
    <circle cx="690" cy="80" r="6"/>
  </g>
  <path d="M690 80 l16 -10 l-4 18 z" fill="#f2d38a"/>
  <g transform="translate(150,255)" fill="none" stroke="#e0736a" stroke-width="3" opacity="0.85">
    <circle cx="0" cy="-58" r="22" fill="#2c1210"/>
    <rect x="-26" y="-30" width="52" height="66" rx="10" fill="#2c1210"/>
    <line x1="-26" y1="-10" x2="-52" y2="20"/><line x1="26" y1="-10" x2="52" y2="20"/>
    <line x1="-14" y1="36" x2="-18" y2="80"/><line x1="14" y1="36" x2="18" y2="80"/>
    <circle cx="-8" cy="-60" r="3" fill="#e0736a" stroke="none"/><circle cx="8" cy="-60" r="3" fill="#e0736a" stroke="none"/>
  </g>
  <rect x="500" y="330" width="230" height="86" rx="10" fill="#1c0e0d" stroke="#e8b45a" stroke-width="2"/>
  <text x="615" y="372" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#f2d38a">+629%</text>
  <text x="615" y="398" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2" fill="#c99b6a">INTRADAY PEAK</text>
  <text x="400" y="460" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#f0e2d6">UNITREE &#183; SHANGHAI STAR MARKET</text>
  <text x="400" y="484" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#a97e6a">FIRST MAINLAND HUMANOID ROBOT IPO</text>
</svg>
