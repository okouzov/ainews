<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A plug icon splitting a git commit chain while a shield cracks behind it">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1006"/><stop offset="1" stop-color="#33200c"/>
    </linearGradient>
    <linearGradient id="plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#cc785c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg7)"/>
  <g stroke="#7a5a30" stroke-width="3" fill="none" opacity="0.8">
    <circle cx="180" cy="240" r="14"/><circle cx="290" cy="240" r="14"/><circle cx="400" cy="240" r="14"/>
    <line x1="194" y1="240" x2="276" y2="240"/><line x1="304" y1="240" x2="386" y2="240"/>
  </g>
  <g stroke="#e04b4b" stroke-width="3" fill="none">
    <line x1="414" y1="240" x2="470" y2="240" stroke-dasharray="6 6"/>
  </g>
  <circle cx="510" cy="240" r="14" stroke="#e04b4b" stroke-width="3" fill="none"/>
  <g transform="translate(470 150)">
    <rect x="0" y="20" width="60" height="40" rx="6" fill="url(#plug)"/>
    <rect x="12" y="0" width="10" height="24" fill="url(#plug)"/>
    <rect x="38" y="0" width="10" height="24" fill="url(#plug)"/>
    <line x1="30" y1="60" x2="30" y2="90" stroke="#ffd166" stroke-width="4"/>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#f0e2d6">PLUGIN4SHELL</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c9a06f">A PINNED COMMIT THAT WASN&#8217;T</text>
</svg>