<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0b1b2b"/>
<stop offset="1" stop-color="#15293d"/>
</linearGradient>
<linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#4f8cff"/>
<stop offset="1" stop-color="#1d4ed8"/>
</linearGradient>
</defs>
<rect width="800" height="500" fill="url(#bg)"/>
<g opacity="0.12">
<circle cx="120" cy="90" r="160" fill="#4f8cff"/>
<circle cx="700" cy="420" r="200" fill="#1d4ed8"/>
</g>
<g transform="translate(130,120)">
<path d="M90 0 L180 35 L180 110 C180 180 135 225 90 245 C45 225 0 180 0 110 L0 35 Z" fill="url(#shield)" opacity="0.9"/>
<path d="M90 30 L150 55 L150 110 C150 160 120 195 90 210 C60 195 30 160 30 110 L30 55 Z" fill="#0b1b2b" opacity="0.5"/>
<circle cx="90" cy="105" r="28" fill="#e2ecff"/>
<rect x="76" y="100" width="28" height="36" rx="4" fill="#0b1b2b"/>
<rect x="82" y="88" width="16" height="20" rx="8" fill="none" stroke="#0b1b2b" stroke-width="6"/>
</g>
<g transform="translate(400,90)" fill="#8fb3ff" font-family="Georgia, serif">
<text x="0" y="0" font-size="30" fill="#ffffff" font-weight="bold">Make AI Work</text>
<text x="0" y="40" font-size="30" fill="#ffffff" font-weight="bold">for Americans Act</text>
<text x="0" y="85" font-size="17" fill="#9fb8dd">Sen. Mark Kelly, Arizona</text>
</g>
<g transform="translate(400,160)" font-family="Georgia, serif">
<rect x="0" y="20" width="340" height="2" fill="#2c4a6e"/>
<text x="0" y="55" font-size="15" fill="#c6d7ef">Would require companies that profit</text>
<text x="0" y="78" font-size="15" fill="#c6d7ef">most from AI to invest in the workers</text>
<text x="0" y="101" font-size="15" fill="#c6d7ef">AI could displace.</text>
</g>
<g transform="translate(400,250)" font-family="Georgia, serif">
<text x="0" y="0" font-size="60" fill="#4f8cff" font-weight="bold">millions</text>
<text x="0" y="28" font-size="15" fill="#9fb8dd">of U.S. jobs at estimated risk</text>
</g>
<g transform="translate(60,420)" font-family="Georgia, serif" fill="#7f9bc4">
<text x="0" y="0" font-size="13">U.S. SENATE</text>
<text x="620" y="0" font-size="13" text-anchor="end">OCTOBER 2026</text>
</g>
</svg>