<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A rising capability line and a falling price line for Opus 5.5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1226"/><stop offset="1" stop-color="#2a1b36"/>
    </linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2b880"/><stop offset="1" stop-color="#ffd9a8"/></linearGradient><radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f2b880" stop-opacity="0.5"/><stop offset="1" stop-color="#f2b880" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
<circle cx="560" cy="150" r="130" fill="url(#glow)"/>
<g stroke="#2c3763" stroke-width="1" opacity="0.8"><line x1="110" y1="80" x2="110" y2="380"/><line x1="110" y1="380" x2="700" y2="380"/>
<line x1="110" y1="140" x2="700" y2="140" opacity="0.4"/>
<line x1="110" y1="200" x2="700" y2="200" opacity="0.4"/>
<line x1="110" y1="260" x2="700" y2="260" opacity="0.4"/>
<line x1="110" y1="320" x2="700" y2="320" opacity="0.4"/>
</g>
<polyline points="130,250 260,215 390,180 520,150 650,120" fill="none" stroke="url(#ln)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="130,130 260,165 390,215 520,270 650,320" fill="none" stroke="#7d8cf0" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>
<circle cx="130" cy="250" r="8" fill="#f2b880"/>
<circle cx="260" cy="215" r="8" fill="#f2b880"/>
<circle cx="390" cy="180" r="8" fill="#f2b880"/>
<circle cx="520" cy="150" r="8" fill="#f2b880"/>
<circle cx="650" cy="120" r="8" fill="#f2b880"/>
<circle cx="130" cy="130" r="7" fill="#0c1226" stroke="#a9b6e8" stroke-width="3"/>
<circle cx="260" cy="165" r="7" fill="#0c1226" stroke="#a9b6e8" stroke-width="3"/>
<circle cx="390" cy="215" r="7" fill="#0c1226" stroke="#a9b6e8" stroke-width="3"/>
<circle cx="520" cy="270" r="7" fill="#0c1226" stroke="#a9b6e8" stroke-width="3"/>
<circle cx="650" cy="320" r="7" fill="#0c1226" stroke="#a9b6e8" stroke-width="3"/>
<text x="655" y="100" font-family="Georgia, serif" font-size="14" fill="#f2b880">CAPABILITY</text>
<text x="655" y="352" font-family="Georgia, serif" font-size="14" fill="#a9b6e8">PRICE</text>
<g transform="translate(150 60)"><path d="M0 0 l220 0 l-26 36 l-220 0 z" fill="#ffd166" opacity="0.92"/><text x="88" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#241a33">OUTPUT $25 &#8594; $20</text></g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="7" fill="#f0e2d6">CLAUDE OPUS 5.5</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#8f86b8">FABLE-LEVEL &#183; LOWER PRICE</text>
</svg>
