<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A microchip linked by circuit lines to a stock warrant certificate showing 12.2 billion dollars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161029"/><stop offset="1" stop-color="#241a3d"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6fd6"/><stop offset="1" stop-color="#5c3fa8"/>
    </linearGradient>
    <linearGradient id="cert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/><stop offset="1" stop-color="#f2c76e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(160 175)">
    <rect x="0" y="0" width="150" height="150" rx="14" fill="url(#chip)"/>
    <g stroke="#d8c8f7" stroke-width="3">
      <line x1="20" y1="-16" x2="20" y2="0"/><line x1="55" y1="-16" x2="55" y2="0"/>
      <line x1="95" y1="-16" x2="95" y2="0"/><line x1="130" y1="-16" x2="130" y2="0"/>
      <line x1="20" y1="150" x2="20" y2="166"/><line x1="55" y1="150" x2="55" y2="166"/>
      <line x1="95" y1="150" x2="95" y2="166"/><line x1="130" y1="150" x2="130" y2="166"/>
      <line x1="-16" y1="30" x2="0" y2="30"/><line x1="-16" y1="70" x2="0" y2="70"/>
      <line x1="-16" y1="110" x2="0" y2="110"/><line x1="150" y1="30" x2="166" y2="30"/>
      <line x1="150" y1="70" x2="166" y2="70"/><line x1="150" y1="110" x2="166" y2="110"/>
    </g>
    <rect x="30" y="30" width="90" height="90" rx="8" fill="#241a3d"/>
    <g fill="#c9b6f2"><circle cx="55" cy="55" r="5"/><circle cx="95" cy="55" r="5"/><circle cx="55" cy="95" r="5"/><circle cx="95" cy="95" r="5"/></g>
  </g>
  <g stroke="#8f6fd6" stroke-width="2.5" opacity="0.8" fill="none">
    <path d="M330 250 L470 220"/>
  </g>
  <circle cx="470" cy="220" r="6" fill="#c9b6f2"/>
  <g transform="translate(480 130)">
    <rect x="0" y="0" width="230" height="170" rx="10" fill="url(#cert)" stroke="#7a5a1e" stroke-width="2"/>
    <text x="115" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#4a3612">WARRANT</text>
    <line x1="24" y1="72" x2="206" y2="72" stroke="#7a5a1e" stroke-width="1.5"/>
    <text x="115" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#3a2a0e">$12.2B</text>
    <text x="115" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6b4f1c">GOOGLE &#8594; MARVELL</text>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#ece4fa">CUSTOM AI CHIP DEAL</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a48fd6">MARVELL &#183; GOOGLE &#183; THROUGH FY2033</text>
</svg>