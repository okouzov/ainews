<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An observatory dome with a telescope pointed at scattered chat bubbles of varying sizes, representing independent research into real AI usage">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1218"/><stop offset="1" stop-color="#132030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5ec8c0" stop-opacity="0.4"/><stop offset="1" stop-color="#5ec8c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="180" r="230" fill="url(#glow)"/>
  <g fill="#8fa0b8" opacity="0.7">
    <circle cx="120" cy="70" r="1.6"/><circle cx="660" cy="55" r="1.6"/><circle cx="720" cy="120" r="1.4"/>
    <circle cx="200" cy="40" r="1.2"/><circle cx="560" cy="90" r="1.3"/>
  </g>
  <path d="M250 340 a150 90 0 0 1 300 0 z" fill="#152838" stroke="#5ec8c0" stroke-width="2"/>
  <rect x="220" y="340" width="360" height="18" rx="4" fill="#0e1c28" stroke="#5ec8c0" stroke-width="2"/>
  <g stroke="#7fd9d1" stroke-width="6" stroke-linecap="round">
    <line x1="400" y1="300" x2="500" y2="170"/>
  </g>
  <circle cx="505" cy="162" r="14" fill="none" stroke="#7fd9d1" stroke-width="4"/>
  <g fill="#f2b880" opacity="0.9">
    <ellipse cx="590" cy="150" rx="34" ry="24" />
    <path d="M566 168 l-12 14 l18 -4 z" fill="#f2b880"/>
    <ellipse cx="650" cy="220" rx="24" ry="17" opacity="0.75"/>
    <path d="M634 232 l-9 10 l14 -3 z" opacity="0.75"/>
    <ellipse cx="540" cy="240" rx="18" ry="13" opacity="0.6"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f0e2d6">THE AI OBSERVATORY</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fa8a3">HOW PEOPLE REALLY USE AI</text>
