<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A glowing wafer-scale chip mounted in a server rack with a 750 petaflops label">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f0a"/><stop offset="1" stop-color="#2e1810"/>
    </linearGradient>
    <linearGradient id="wafer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb15c"/><stop offset="1" stop-color="#d4432f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(120 90)">
    <rect x="0" y="0" width="180" height="320" rx="6" fill="#231310" stroke="#5c3324" stroke-width="2"/>
    <g stroke="#5c3324" stroke-width="1.5">
      <line x1="0" y1="60" x2="180" y2="60"/><line x1="0" y1="120" x2="180" y2="120"/>
      <line x1="0" y1="180" x2="180" y2="180"/><line x1="0" y1="240" x2="180" y2="240"/><line x1="0" y1="280" x2="180" y2="280"/>
    </g>
    <g fill="#ffb15c" opacity="0.85">
      <circle cx="20" cy="30" r="4"/><circle cx="40" cy="30" r="4"/>
      <circle cx="20" cy="90" r="4"/><circle cx="40" cy="90" r="4"/>
      <circle cx="20" cy="150" r="4"/><circle cx="40" cy="150" r="4"/>
      <circle cx="20" cy="210" r="4"/><circle cx="40" cy="210" r="4"/>
    </g>
  </g>
  <g transform="translate(340 110)">
    <rect x="0" y="0" width="330" height="280" rx="16" fill="url(#wafer)" opacity="0.95"/>
    <g stroke="#7a2010" stroke-width="1.5" opacity="0.6">
      <line x1="55" y1="0" x2="55" y2="280"/><line x1="110" y1="0" x2="110" y2="280"/>
      <line x1="165" y1="0" x2="165" y2="280"/><line x1="220" y1="0" x2="220" y2="280"/><line x1="275" y1="0" x2="275" y2="280"/>
      <line x1="0" y1="47" x2="330" y2="47"/><line x1="0" y1="94" x2="330" y2="94"/><line x1="0" y1="141" x2="330" y2="141"/>
      <line x1="0" y1="188" x2="330" y2="188"/><line x1="0" y1="235" x2="330" y2="235"/>
    </g>
    <text x="165" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2e1005">750</text>
    <text x="165" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#4a1a08">PFLOPS</text>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#f7ded0">CEREBRAS CS-4</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c78060">NEXUS RACK-SCALE ARCHITECTURE</text>
</svg>