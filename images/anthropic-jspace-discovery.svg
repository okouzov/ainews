<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Layered translucent panels with faint ghostly words floating inside a dark neural network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151027"/>
      <stop offset="1" stop-color="#241a3f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3b7a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a5ba8" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#4c3f7a" stroke-width="1" opacity="0.5">
    <line x1="120" y1="90" x2="300" y2="200"/>
    <line x1="300" y1="200" x2="220" y2="340"/>
    <line x1="300" y1="200" x2="470" y2="160"/>
    <line x1="470" y1="160" x2="600" y2="260"/>
    <line x1="470" y1="160" x2="540" y2="70"/>
    <line x1="600" y1="260" x2="700" y2="230"/>
    <line x1="600" y1="260" x2="640" y2="380"/>
    <line x1="220" y1="340" x2="380" y2="400"/>
  </g>
  <g fill="#9986cf">
    <circle cx="120" cy="90" r="5"/>
    <circle cx="300" cy="200" r="7"/>
    <circle cx="220" cy="340" r="5"/>
    <circle cx="470" cy="160" r="7"/>
    <circle cx="540" cy="70" r="5"/>
    <circle cx="600" cy="260" r="6"/>
    <circle cx="700" cy="230" r="5"/>
    <circle cx="640" cy="380" r="5"/>
    <circle cx="380" cy="400" r="5"/>
  </g>

  <rect x="150" y="120" width="500" height="260" rx="18" fill="url(#panel)" stroke="#8a72c9" stroke-width="1.5"/>
  <rect x="210" y="160" width="380" height="180" rx="14" fill="#2a1f4a" opacity="0.45" stroke="#6f5aa8" stroke-width="1"/>

  <text x="285" y="215" font-family="Georgia, serif" font-size="19" fill="#c9bcec" opacity="0.85" letter-spacing="2">protein</text>
  <text x="470" y="255" font-family="Georgia, serif" font-size="15" fill="#a998d8" opacity="0.55" letter-spacing="2">panic</text>
  <text x="330" y="300" font-family="Georgia, serif" font-size="13" fill="#a998d8" opacity="0.4" letter-spacing="2">almost there</text>
  <text x="470" y="330" font-family="Georgia, serif" font-size="14" fill="#a998d8" opacity="0.5" letter-spacing="2">reconsider</text>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="7" fill="#e6def7">THE J-SPACE</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a998d8">WORDS BENEATH THE OUTPUT</text>
</svg>
