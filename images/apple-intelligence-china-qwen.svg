<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An apple silhouette linked by a bridge of light to a geometric Qwen-style mark, over a dark red and steel gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160c10"/>
      <stop offset="1" stop-color="#2a1418"/>
    </linearGradient>
    <linearGradient id="apple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8dde2"/>
      <stop offset="1" stop-color="#8f98a2"/>
    </linearGradient>
    <linearGradient id="qwen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6553f"/>
      <stop offset="1" stop-color="#c2381f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#3a2226" stroke-width="1" opacity="0.6">
    <line x1="0" y1="115" x2="800" y2="115"/>
    <line x1="0" y1="385" x2="800" y2="385"/>
  </g>

  <g transform="translate(270 250)">
    <path d="M0 -70 C-40 -70 -60 -35 -60 5 C-60 55 -25 95 5 95 C20 95 25 88 42 88 C59 88 68 95 82 95 C112 95 145 45 145 5 C145 -25 125 -45 100 -45 C80 -45 68 -32 48 -32 C30 -32 22 -45 2 -45 C-15 -45 -30 -60 0 -70 Z" fill="url(#apple)" opacity="0"/>
    <path d="M0 -95 C-8 -80 -6 -62 8 -55 C22 -62 26 -82 18 -98 C10 -95 4 -95 0 -95 Z" fill="url(#apple)"/>
    <path d="M8 -55 C-32 -55 -55 -20 -55 18 C-55 68 -22 108 6 108 C22 108 27 100 45 100 C63 100 70 108 84 108 C114 108 147 60 147 18 C147 -14 126 -36 100 -36 C79 -36 66 -22 45 -22 C26 -22 16 -55 8 -55 Z" fill="url(#apple)"/>
  </g>

  <g stroke="#e6a488" stroke-width="2.5" stroke-dasharray="2 10" opacity="0.85">
    <line x1="365" y1="248" x2="475" y2="248"/>
  </g>

  <g transform="translate(545 250)">
    <rect x="-70" y="-70" width="140" height="140" rx="18" fill="url(#qwen)" opacity="0.18" stroke="#e6553f" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#f0876f" stroke-width="4"/>
    <path d="M-30 -6 L0 30 L30 -6" fill="none" stroke="#f6c3b3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-24" r="6" fill="#f6c3b3"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#ecdcd8">APPLE INTELLIGENCE CLEARED FOR CHINA</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#b98070">POWERED BY ALIBABA'S QWEN</text>
