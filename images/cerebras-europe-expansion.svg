    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#1c4a44" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="360" x2="800" y2="360"/>
