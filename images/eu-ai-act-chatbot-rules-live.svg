<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A ring of stars around a speech bubble with a live indicator, over a navy and gold gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#182450"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2c3d78"/>
      <stop offset="1" stop-color="#182450"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#243668" stroke-width="1" opacity="0.6">
    <line x1="0" y1="115" x2="800" y2="115"/>
    <line x1="0" y1="385" x2="800" y2="385"/>
  </g>

  <g transform="translate(400 240)">
    <circle r="120" fill="none" stroke="#3d4f8c" stroke-width="2" opacity="0.7"/>
    <g fill="#e8c15c">
      <g id="star-ref">
        <path d="M0 -10 L2.4 -3.4 L9.5 -3.1 L3.8 1.3 L5.9 8.1 L0 4 L-5.9 8.1 L-3.8 1.3 L-9.5 -3.1 L-2.4 -3.4 Z"/>
      </g>
      <use href="#star-ref" transform="translate(0 -120)"/>
      <use href="#star-ref" transform="translate(60 -104) scale(0.9)"/>
      <use href="#star-ref" transform="translate(104 -60) scale(0.9)"/>
      <use href="#star-ref" transform="translate(120 0)"/>
      <use href="#star-ref" transform="translate(104 60) scale(0.9)"/>
      <use href="#star-ref" transform="translate(60 104) scale(0.9)"/>
      <use href="#star-ref" transform="translate(0 120)"/>
      <use href="#star-ref" transform="translate(-60 104) scale(0.9)"/>
      <use href="#star-ref" transform="translate(-104 60) scale(0.9)"/>
      <use href="#star-ref" transform="translate(-120 0)"/>
      <use href="#star-ref" transform="translate(-104 -60) scale(0.9)"/>
      <use href="#star-ref" transform="translate(-60 -104) scale(0.9)"/>
    </g>

    <path d="M-58 -40 h116 a14 14 0 0 1 14 14 v42 a14 14 0 0 1 -14 14 h-70 l-26 22 v-22 h-20 a14 14 0 0 1 -14 -14 v-42 a14 14 0 0 1 14 -14 Z" fill="url(#bubble)" stroke="#8fa0e0" stroke-width="3"/>
    <circle cx="-24" cy="0" r="6" fill="#e6ecff"/>
    <circle cx="4" cy="0" r="6" fill="#e6ecff"/>
    <circle cx="32" cy="0" r="6" fill="#e6ecff"/>
    <circle cx="86" cy="-52" r="9" fill="#e0546a"/>
    <text x="86" y="-48" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#0b1330" font-weight="bold">L</text>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#e6ecff">EU AI ACT TRANSPARENCY RULES LIVE</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8b9bc9">HIGH-RISK OBLIGATIONS DELAYED TO 2027</text>
</svg>
