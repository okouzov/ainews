  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#f0e2d6">A LANGUAGE OF THEIR OWN</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c9a6d8">OBSERVABLE IS NOT UNDERSTANDABLE</text>
