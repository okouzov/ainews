      <stop offset="0" stop-color="#1c1030"/><stop offset="1" stop-color="#301a3a"/>
    </linearGradient>
    <linearGradient id="botL5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#cc785c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgL5)"/>
  <g transform="translate(200 200)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="url(#botL5)"/>
    <circle cx="-10" cy="-4" r="5" fill="#1a1006"/><circle cx="10" cy="-4" r="5" fill="#1a1006"/>
  </g>
  <g transform="translate(400 130)">
