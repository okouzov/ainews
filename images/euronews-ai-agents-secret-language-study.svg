    <circle cx="-10" cy="-4" r="5" fill="#0e1f1a"/><circle cx="10" cy="-4" r="5" fill="#0e1f1a"/>
  </g>
  <g stroke="#a894d8" stroke-width="2" stroke-dasharray="4 6" fill="none">
    <line x1="235" y1="185" x2="366" y2="140"/><line x1="432" y1="150" x2="528" y2="200"/><line x1="525" y1="235" x2="235" y2="215"/>
  </g>
  <g font-family="Georgia, serif" font-size="15" fill="#f0e2d6">
