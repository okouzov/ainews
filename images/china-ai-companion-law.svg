<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A chat bubble dissolving into fading pixels beside a closed padlock, over a dark red gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#210f0f"/>
      <stop offset="1" stop-color="#3a1414"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2665a"/>
      <stop offset="1" stop-color="#a53838"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#5a2a2a" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <path d="M220 140 h240 a30 30 0 0 1 30 30 v110 a30 30 0 0 1 -30 30 h-150 l-50 50 v-50 h-40 a30 30 0 0 1 -30 -30 v-110 a30 30 0 0 1 30 -30 z"
        fill="url(#bubble)" opacity="0.95"/>
  <g fill="#f6dcd6">
    <circle cx="280" cy="225" r="9"/>
    <circle cx="335" cy="225" r="9" opacity="0.6"/>
    <circle cx="390" cy="225" r="9" opacity="0.25"/>
  </g>

  <g fill="#c9756a" opacity="0.7">
    <rect x="470" y="150" width="10" height="10"/>
    <rect x="500" y="170" width="8" height="8" opacity="0.6"/>
    <rect x="525" y="140" width="7" height="7" opacity="0.4"/>
    <rect x="490" y="200" width="6" height="6" opacity="0.3"/>
    <rect x="540" y="190" width="9" height="9" opacity="0.5"/>
    <rect x="560" y="220" width="6" height="6" opacity="0.25"/>
    <rect x="580" y="160" width="5" height="5" opacity="0.2"/>
  </g>

  <g transform="translate(600 300)">
    <rect x="-38" y="0" width="76" height="62" rx="8" fill="#3a1c1c" stroke="#7a3a34" stroke-width="4"/>
    <path d="M-24 0 v-24 a24 24 0 0 1 48 0 v24" fill="none" stroke="#7a3a34" stroke-width="8"/>
    <circle cx="0" cy="30" r="9" fill="#e2665a"/>
    <rect x="-4" y="30" width="8" height="20" fill="#e2665a"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="5" fill="#f2ddd6">AI COMPANIONS SILENCED</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c98f84">CHINA'S RULES TAKE EFFECT</text>
</svg>
