<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An arena ring with leaderboard bars inside it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d0c"/><stop offset="1" stop-color="#4a3414"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#b9792f"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d98f3a"/><stop offset="1" stop-color="#ffe4a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="270" rx="230" ry="150" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <ellipse cx="400" cy="270" rx="230" ry="150" fill="none" stroke="#2a1d0c" stroke-width="2" opacity="0.5"/>
  <g fill="url(#bar2)">
    <rect x="310" y="300" width="34" height="60"/>
    <rect x="360" y="260" width="34" height="100"/>
    <rect x="410" y="220" width="34" height="140"/>
    <rect x="460" y="280" width="34" height="80"/>
  </g>
  <text x="400" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="3" fill="#ffe4a8">ARENA</text>
  <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="2" fill="#f7e7c9">ARENA RAISES $200 MILLION</text>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="3" fill="#d9ad6e">VALUATION NEARLY DOUBLES TO $3.1B</text>
</svg>