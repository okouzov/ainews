<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A bar chart showing European data center electricity demand rising from 96 to 236 terawatt hours by 2035">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1622"/><stop offset="1" stop-color="#1e2a12"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2a65a"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe08a" stop-opacity="0.35"/><stop offset="1" stop-color="#ffe08a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="560" cy="150" r="150" fill="url(#glow)"/>
  <g stroke="#33452c" stroke-width="1" opacity="0.7">
    <line x1="110" y1="80" x2="110" y2="380"/><line x1="110" y1="380" x2="700" y2="380"/>
    <line x1="110" y1="320" x2="700" y2="320" opacity="0.4"/>
    <line x1="110" y1="260" x2="700" y2="260" opacity="0.4"/>
    <line x1="110" y1="200" x2="700" y2="200" opacity="0.4"/>
    <line x1="110" y1="140" x2="700" y2="140" opacity="0.4"/>
  </g>
  <rect x="200" y="303" width="90" height="77" fill="url(#bar)" opacity="0.55"/>
  <text x="245" y="295" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#ffe08a">96 TWh</text>
  <text x="245" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c9d6bb">2024</text>
  <rect x="470" y="118" width="90" height="262" fill="url(#bar)"/>
  <text x="515" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#ffe08a">236 TWh</text>
  <text x="515" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#c9d6bb">2035</text>
  <path d="M290 303 C 360 250, 400 200, 470 118" stroke="#ffe08a" stroke-width="3" fill="none" stroke-dasharray="2 8" opacity="0.8"/>
  <g transform="translate(645 200)" opacity="0.85">
    <path d="M0 -40 L20 -20 L20 20 L0 40 L-20 20 L-20 -20 Z" fill="none" stroke="#7be8c4" stroke-width="3"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#7be8c4" stroke-width="3"/>
    <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#7be8c4" stroke-width="3"/>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#eef2e6">EU DATA-CENTER POWER DEMAND</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#9fb08a">NEARLY TRIPLING BY 2035, PER EMBER</text>
</svg>