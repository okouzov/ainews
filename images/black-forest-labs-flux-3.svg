<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="An image frame, a film reel and a soundwave merging into one shape"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#1b2b2a"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8956f"/><stop offset="1" stop-color="#cc785c"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd6c0"/><stop offset="1" stop-color="#4a9e8a"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9b6e8"/><stop offset="1" stop-color="#5c6bcc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.9">
    <rect x="230" y="140" width="180" height="150" rx="10" fill="none" stroke="url(#ring1)" stroke-width="5"/>
    <circle cx="290" cy="200" r="18" fill="#f2b880"/>
    <path d="M240 270 l60 -60 l40 40 l70 -50 l0 60 z" fill="#e8956f" opacity="0.6"/>
  </g>
  <g transform="translate(400 190)" opacity="0.9">
