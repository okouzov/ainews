    <path d="M-30 -20 l0 40 l35 -20 z" fill="#8fd6c0"/>
  </g>
  <g transform="translate(560 230)" opacity="0.9">
    <rect x="-90" y="-60" width="180" height="120" rx="10" fill="none" stroke="url(#ring3)" stroke-width="5"/>
    <g stroke="#a9b6e8" stroke-width="5" stroke-linecap="round">
      <line x1="-60" y1="0" x2="-60" y2="-25"/><line x1="-35" y1="0" x2="-35" y2="30"/>
      <line x1="-10" y1="0" x2="-10" y2="-40"/><line x1="15" y1="0" x2="15" y2="20"/>
      <line x1="40" y1="0" x2="40" y2="-15"/><line x1="65" y1="0" x2="65" y2="10"/>
    </g>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#f0e2d6">FLUX 3</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8fd6c0">IMAGE &#183; VIDEO &#183; AUDIO &#183; ACTION</text>
