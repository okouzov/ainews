    <rect x="458" y="150" width="16" height="16" fill="none"/>
    <rect x="430" y="178" width="16" height="16" fill="none"/>
    <rect x="458" y="178" width="16" height="16" fill="none"/>
    <line x1="446" y1="158" x2="458" y2="158"/><line x1="446" y1="186" x2="458" y2="186"/>
