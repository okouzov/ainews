    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c6ef5" stop-opacity="0.45"/><stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8574a" stop-opacity="0.5"/><stop offset="1" stop-color="#e8574a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="330" cy="230" r="170" fill="url(#glowA)"/>
  <circle cx="330" cy="230" r="140" fill="none" stroke="#7f97f0" stroke-width="2" opacity="0.55" stroke-dasharray="6 6"/>
