  <circle cx="560" cy="150" r="30" fill="#241017" stroke="#f0a89c" stroke-width="2.5"/>
  <text x="560" y="156" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#f6d2ca">MANUS</text>
  <path d="M480 195 L525 168" stroke="#f0a89c" stroke-width="2.5" stroke-dasharray="2 6" opacity="0.8"/>
