<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A four-pointed star icon representing Gemini surrounded by a growing network of user nodes, with a one billion badge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1220"/><stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8bf5" stop-opacity="0.5"/><stop offset="1" stop-color="#4c8bf5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab4ff"/><stop offset="0.5" stop-color="#f5a3c7"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="215" r="190" fill="url(#glow)"/>
  <path d="M400 90 C408 170 420 182 500 190 C420 198 408 210 400 290 C392 210 380 198 300 190 C380 182 392 170 400 90 Z" fill="url(#star)"/>
  <g stroke="#8fb3f7" stroke-width="1.5" opacity="0.7">
    <circle cx="220" cy="120" r="4" fill="#8fb3f7"/><circle cx="180" cy="220" r="4" fill="#8fb3f7"/><circle cx="240" cy="320" r="4" fill="#8fb3f7"/>
    <circle cx="580" cy="120" r="4" fill="#f7c9e0"/><circle cx="620" cy="220" r="4" fill="#f7c9e0"/><circle cx="560" cy="320" r="4" fill="#f7c9e0"/>
    <line x1="220" y1="120" x2="300" y2="190"/><line x1="180" y1="220" x2="300" y2="190"/><line x1="240" y1="320" x2="330" y2="250"/>
    <line x1="580" y1="120" x2="500" y2="190"/><line x1="620" y1="220" x2="500" y2="190"/><line x1="560" y1="320" x2="470" y2="250"/>
  </g>
  <circle cx="400" cy="410" r="55" fill="#161027" stroke="#f0e2d6" stroke-width="2"/>
  <text x="400" y="403" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f0e2d6">1B</text>
  <text x="400" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#a99bd6">USERS/MO</text>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="5" fill="#f0e2d6">GEMINI CROSSES A BILLION</text>
</svg>