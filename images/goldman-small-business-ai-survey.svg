<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A small storefront beside a rising bar chart under a sparkle, representing small-business AI adoption"><defs>
    <linearGradient id="skyg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08121a"/>
      <stop offset="1" stop-color="#0f2e2a"/>
    </linearGradient>
    <linearGradient id="shopg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdf91"/>
      <stop offset="1" stop-color="#c98b2e"/>
    </linearGradient>
    <linearGradient id="roofg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9e6b"/>
      <stop offset="1" stop-color="#c24f2a"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dffd6"/>
      <stop offset="1" stop-color="#1f8a6e"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyg3)"/>

  <g fill="#bfe8da" opacity="0.4">
    <circle cx="90" cy="60" r="1.6"/><circle cx="220" cy="90" r="1.2"/><circle cx="700" cy="70" r="1.5"/>
  </g>

  <circle cx="230" cy="150" r="110" fill="url(#shine)"/>

  <g transform="translate(110,230)">
    <polygon points="0,60 100,0 200,60" fill="url(#roofg)"/>
    <rect x="15" y="60" width="170" height="130" fill="url(#shopg)"/>
    <rect x="70" y="120" width="60" height="70" fill="#4a3014"/>
    <rect x="35" y="85" width="35" height="30" fill="#2c3b55" opacity="0.85"/>
    <rect x="135" y="85" width="35" height="30" fill="#2c3b55" opacity="0.85"/>
  </g>

  <g>
    <path d="M250 110 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 z" fill="#ffe9a8"/>
    <path d="M300 150 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill="#ffe9a8" opacity="0.8"/>
  </g>

  <g transform="translate(470,360)">
    <rect x="0" y="-60" width="46" height="60" fill="url(#barg)"/>
    <rect x="60" y="-110" width="46" height="110" fill="url(#barg)"/>
    <rect x="120" y="-170" width="46" height="170" fill="url(#barg)"/>
    <rect x="180" y="-230" width="46" height="230" fill="url(#barg)"/>
  </g>

  <text x="400" y="445" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#eafff2">SMALL BUSINESS AI</text>
  <text x="400" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#8fc9ab">ADOPTION &#183; ACROSS THE COUNTRY</text>
</svg>