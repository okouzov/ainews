<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A city power grid with warning pulses spreading along the lines">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#180d0d"/><stop offset="1" stop-color="#331414"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <g stroke="#7a3030" stroke-width="2" opacity="0.7">
    <line x1="80" y1="420" x2="80" y2="220"/><line x1="80" y1="220" x2="260" y2="140"/>
    <line x1="260" y1="140" x2="440" y2="220"/><line x1="440" y1="220" x2="440" y2="420"/>
    <line x1="260" y1="140" x2="260" y2="420"/><line x1="440" y1="220" x2="620" y2="140"/>
    <line x1="620" y1="140" x2="720" y2="220"/><line x1="620" y1="140" x2="620" y2="420"/>
  </g>
  <g fill="#f2b880">
    <circle cx="80" cy="220" r="5"/><circle cx="260" cy="140" r="5"/><circle cx="440" cy="220" r="5"/>
    <circle cx="620" cy="140" r="5"/><circle cx="720" cy="220" r="5"/>
  </g>
  <g fill="#e04b4b" opacity="0.85">
    <circle cx="260" cy="140" r="16"><animate attributeName="r" values="16;30;16" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.85;0;0.85" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M255 120 l-15 30 h12 l-8 22 22 -30 h-12 z" fill="#ffd166"/>
