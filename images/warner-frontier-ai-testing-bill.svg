<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A capitol dome behind a shield with a checkmark, symbolizing mandatory AI safety testing legislation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1622"/><stop offset="1" stop-color="#1a2436"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c7099"/><stop offset="1" stop-color="#374a68"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c96a"/><stop offset="1" stop-color="#c99a3a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#2e3c56" stroke-width="1" opacity="0.6">
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>
  <g transform="translate(400 250)">
    <ellipse cx="0" cy="-70" rx="46" ry="60" fill="url(#dome)"/>
    <rect x="-8" y="-140" width="16" height="26" fill="#5c7099"/>
    <circle cx="0" cy="-146" r="7" fill="#f0c96a"/>
    <rect x="-140" y="10" width="280" height="20" fill="#2e3c56"/>
    <rect x="-120" y="-10" width="240" height="20" fill="#374a68"/>
    <g fill="#4a5e82">
      <rect x="-110" y="-70" width="18" height="60"/>
      <rect x="-75" y="-70" width="18" height="60"/>
      <rect x="-40" y="-70" width="18" height="60"/>
      <rect x="22" y="-70" width="18" height="60"/>
      <rect x="57" y="-70" width="18" height="60"/>
      <rect x="92" y="-70" width="18" height="60"/>
