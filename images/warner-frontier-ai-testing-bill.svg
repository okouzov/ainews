  </g>
  <g transform="translate(400 300)">
    <path d="M0 -90 L64 -66 V0 Q64 62 0 96 Q-64 62 -64 0 V-66 Z" fill="url(#shield)" stroke="#8a6a20" stroke-width="4"/>
    <path d="M-28 6 L-8 28 L34 -24" fill="none" stroke="#3a2a10" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
