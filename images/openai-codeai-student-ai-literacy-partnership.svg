<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A graduation cap above a network of connected nodes shaped like a classroom of students, in teal and warm tones, representing an AI literacy partnership for schools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a16"/><stop offset="1" stop-color="#132922"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#5ec8c0" stop-opacity="0.45"/><stop offset="1" stop-color="#5ec8c0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="220" fill="url(#glow)"/>
  <g transform="translate(400,160)">
    <path d="M-120 0 l120 -50 l120 50 l-120 50 z" fill="#152822" stroke="#7fd9d1" stroke-width="3"/>
    <line x1="0" y1="50" x2="0" y2="95" stroke="#7fd9d1" stroke-width="3"/>
    <circle cx="0" cy="100" r="7" fill="#f2b880"/>
    <line x1="120" y1="0" x2="120" y2="55" stroke="#7fd9d1" stroke-width="2" opacity="0.7"/>
  </g>
  <g stroke="#e8956f" stroke-width="2" opacity="0.85">
    <line x1="260" y1="330" x2="400" y2="270"/>
    <line x1="330" y1="360" x2="400" y2="270"/>
    <line x1="470" y1="360" x2="400" y2="270"/>
    <line x1="540" y1="330" x2="400" y2="270"/>
    <line x1="260" y1="330" x2="330" y2="360"/>
    <line x1="470" y1="360" x2="540" y2="330"/>
  </g>
  <g fill="#0e1c18" stroke="#f2b880" stroke-width="2.5">
    <circle cx="400" cy="270" r="16"/>
    <circle cx="260" cy="330" r="12"/>
    <circle cx="330" cy="360" r="12"/>
    <circle cx="470" cy="360" r="12"/>
    <circle cx="540" cy="330" r="12"/>
  </g>
  <text x="400" y="450" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="4" fill="#f0e2d6">OPENAI &#215; CODEAI</text>
  <text x="400" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#7fa8a3">BUILDING AI LITERACY IN SCHOOLS</text>
</svg>
