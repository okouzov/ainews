<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A camera icon with a withdrawn AI badge crossed out, over a dark magenta and amber gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0f1e"/>
      <stop offset="1" stop-color="#341a2c"/>
    </linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0507a"/>
      <stop offset="0.5" stop-color="#d1447a"/>
      <stop offset="1" stop-color="#e8a34e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#3a2236" stroke-width="1" opacity="0.6">
    <line x1="0" y1="115" x2="800" y2="115"/>
    <line x1="0" y1="385" x2="800" y2="385"/>
  </g>

  <g transform="translate(400 245)">
    <rect x="-100" y="-70" width="200" height="150" rx="34" fill="none" stroke="url(#cam)" stroke-width="6"/>
    <circle r="46" fill="none" stroke="url(#cam)" stroke-width="6"/>
    <circle r="18" fill="url(#cam)" opacity="0.35"/>
    <circle cx="62" cy="-46" r="9" fill="url(#cam)"/>

    <g transform="translate(150 -95)">
      <circle r="34" fill="#1c0f1e" stroke="#e05a5a" stroke-width="4"/>
      <line x1="-16" y1="-16" x2="16" y2="16" stroke="#e05a5a" stroke-width="5" stroke-linecap="round"/>
      <line x1="16" y1="-16" x2="-16" y2="16" stroke="#e05a5a" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="3" fill="#f0dce6">META WITHDRAWS INSTAGRAM AI TOOL</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c98fa8">PULLED AFTER CONSENT BACKLASH</text>
</svg>
