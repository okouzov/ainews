<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A chip-shaped satellite orbiting Earth on a dashed path with a broken chain link, representing hardware that cannot be repossessed in space">
  <defs>
    <linearGradient id="bgSp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <radialGradient id="earthSp" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#2f6f8f"/><stop offset="1" stop-color="#15324a"/>
    </radialGradient>
    <linearGradient id="chipSp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c073"/><stop offset="1" stop-color="#a97f3f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgSp1)"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" cy="80" r="1.6"/><circle cx="680" cy="60" r="1.8"/>
    <circle cx="730" cy="150" r="1.4"/><circle cx="90" cy="220" r="1.6"/>
    <circle cx="620" cy="95" r="1.3"/><circle cx="260" cy="60" r="1.5"/>
    <circle cx="400" cy="40" r="1.3"/>
  </g>
  <circle cx="230" cy="380" r="150" fill="url(#earthSp)"/>
  <ellipse cx="400" cy="250" rx="300" ry="110" fill="none" stroke="#5a7a95" stroke-width="2" stroke-dasharray="6 9" opacity="0.7"/>
  <g transform="translate(610,175) rotate(-18)">
    <rect x="-28" y="-18" width="56" height="36" rx="4" fill="url(#chipSp)"/>
    <line x1="-40" y1="-8" x2="-28" y2="-8" stroke="#e8c073" stroke-width="3"/>
    <line x1="-40" y1="8" x2="-28" y2="8" stroke="#e8c073" stroke-width="3"/>
    <line x1="40" y1="-8" x2="28" y2="-8" stroke="#e8c073" stroke-width="3"/>
    <line x1="40" y1="8" x2="28" y2="8" stroke="#e8c073" stroke-width="3"/>
  </g>
  <g transform="translate(230,230)">
    <path d="M-10 -10 L10 10 M10 -10 L-10 10" stroke="#e86f6f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-14" cy="0" r="10" fill="none" stroke="#9fb3c4" stroke-width="4"/>
    <circle cx="14" cy="0" r="10" fill="none" stroke="#9fb3c4" stroke-width="4"/>
  </g>
  <text x="610" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="1" fill="#e8c073">CANNOT BE REPOSSESSED</text>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-variant="small-caps" font-size="26" letter-spacing="2" fill="#dfe9f2">Chips Survive Orbit</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2" fill="#7f97ab">CAN THEIR FINANCING SURVIVE TOO?</text>
</svg>