      <circle cx="110" cy="0" r="4"/><circle cx="95" cy="55" r="4"/><circle cx="55" cy="95" r="4"/>
      <circle cx="0" cy="110" r="4"/><circle cx="-55" cy="95" r="4"/><circle cx="-95" cy="55" r="4"/>
      <circle cx="-110" cy="0" r="4"/><circle cx="-95" cy="-55" r="4"/><circle cx="-55" cy="-95" r="4"/>
    </g>
  </g>
  <g transform="translate(310 150)">
