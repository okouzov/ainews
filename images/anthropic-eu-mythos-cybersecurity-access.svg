    <line x1="600" y1="340" x2="670" y2="340"/><line x1="580" y1="360" x2="660" y2="360"/>
  </g>
  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#f0e2d6">MYTHOS ACCESS</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8f86b8">EU CYBERSECURITY AGENCY TESTING BEGINS</text>
