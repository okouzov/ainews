    <circle cx="260" cy="45" r="1.4"/><circle cx="350" cy="110" r="1"/>
    <circle cx="470" cy="60" r="1.5"/><circle cx="560" cy="140" r="1"/>
    <circle cx="660" cy="50" r="1.6"/><circle cx="740" cy="120" r="1.2"/>
    <circle cx="90" cy="230" r="1"/><circle cx="720" cy="230" r="1.1"/>
    <circle cx="40" cy="330" r="1.3"/><circle cx="770" cy="330" r="1"/>
    <circle cx="200" cy="300" r="0.9"/><circle cx="620" cy="300" r="0.9"/>
  </g>

  <circle cx="190" cy="235" r="150" fill="url(#solglow)"/>
  <g stroke="#ffcf66" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="190" y1="120" x2="190" y2="98"/>
    <line x1="190" y1="350" x2="190" y2="372"/>
    <line x1="75" y1="235" x2="53" y2="235"/>
    <line x1="305" y1="235" x2="327" y2="235"/>
    <line x1="109" y1="154" x2="93" y2="138"/>
    <line x1="271" y1="316" x2="287" y2="332"/>
    <line x1="109" y1="316" x2="93" y2="332"/>
    <line x1="271" y1="154" x2="287" y2="138"/>
  </g>
  <circle cx="190" cy="235" r="88" fill="url(#sol)"/>

  <circle cx="470" cy="250" r="58" fill="url(#terra)"/>
  <path d="M430 230 q18 -14 36 -4 q20 10 34 -2" fill="none" stroke="#bfeee2" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M438 275 q22 10 44 2" fill="none" stroke="#bfeee2" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <ellipse cx="470" cy="250" rx="80" ry="20" fill="none" stroke="#7fd7c8" stroke-width="1.4" opacity="0.5" transform="rotate(-18 470 250)"/>

  <circle cx="655" cy="205" r="34" fill="url(#luna)"/>
  <circle cx="643" cy="196" r="34" fill="#0d1330" opacity="0.55"/>
  <circle cx="668" cy="215" r="4.5" fill="#6e7488" opacity="0.8"/>
  <circle cx="658" cy="228" r="3" fill="#6e7488" opacity="0.7"/>

  <text x="400" y="462" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="8" fill="#f0e6c8">GPT-5.6</text>
  <text x="400" y="488" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#8f97c9">SOL &#183; TERRA &#183; LUNA</text>
