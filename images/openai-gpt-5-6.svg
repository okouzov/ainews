<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Three celestial bodies: Sol, Terra and Luna">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1e"/>
      <stop offset="1" stop-color="#1a2150"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.4" cy="0.4" r="0.9">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#e2711d"/>
    </radialGradient>
    <radialGradient id="solglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb937" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb937" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="terra" cx="0.35" cy="0.35" r="1">
      <stop offset="0" stop-color="#9be8ff"/>
      <stop offset="0.5" stop-color="#2f9e8f"/>
      <stop offset="1" stop-color="#14406b"/>
