    <radialGradient id="luna" cx="0.35" cy="0.35" r="1">
      <stop offset="0" stop-color="#f2f2f0"/>
      <stop offset="1" stop-color="#8a8f9e"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <g stroke="#3a437e" stroke-width="0.6" opacity="0.35">
    <path d="M0 420 Q400 380 800 430" fill="none"/>
