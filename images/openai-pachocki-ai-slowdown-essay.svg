      <stop offset="0" stop-color="#9fe6d8"/><stop offset="1" stop-color="#4f9c94"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#233a4e" stroke-width="1" opacity="0.5">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
