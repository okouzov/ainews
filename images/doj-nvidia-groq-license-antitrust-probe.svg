<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A gavel striking above a glowing circuit board, representing the DOJ antitrust probe into Nvidia's license deal with Groq"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1210"/><stop offset="1" stop-color="#2a1614"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#e0a15c" stop-opacity="0.4"/><stop offset="1" stop-color="#e0a15c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="210" r="230" fill="url(#glow)"/>
  <g stroke="#e8c99a" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="330" y1="150" x2="420" y2="240"/>
    <line x1="300" y1="180" x2="345" y2="135"/>
    <line x1="405" y1="255" x2="450" y2="210"/>
  </g>
  <rect x="180" y="290" width="440" height="16" rx="8" fill="#b8703a" opacity="0.85"/>
  <circle cx="230" cy="298" r="26" fill="none" stroke="#b8703a" stroke-width="6"/>
  <circle cx="570" cy="298" r="26" fill="none" stroke="#b8703a" stroke-width="6"/>
  <g stroke="#9be3d8" stroke-width="4" fill="none" opacity="0.8">
    <rect x="300" y="330" width="200" height="90" rx="6"/>
    <line x1="320" y1="350" x2="360" y2="350"/>
    <line x1="320" y1="368" x2="440" y2="368"/>
    <line x1="320" y1="386" x2="400" y2="386"/>
    <circle cx="470" cy="358" r="10"/>
  </g>
  <text x="400" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="4" fill="#f2ddc0">NVIDIA × GROQ</text>
  <text x="400" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#cfa878">DOJ ANTITRUST PROBE</text>
</svg>