  <text x="400" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="8" fill="#f0e6c8">GROK &#183; GPT</text>
  <text x="400" y="456" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#8f97c9">DIVIDED BY DESIGN</text>
