      <stop offset="0" stop-color="#090c1f"/>
      <stop offset="1" stop-color="#171b3c"/>
    </linearGradient>
    <radialGradient id="redorb" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset="0.5" stop-color="#e14b4b"/>
      <stop offset="1" stop-color="#7a1a22"/>
    </radialGradient>
    <radialGradient id="blueorb" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#9adcff"/>
      <stop offset="0.5" stop-color="#3f84e0"/>
      <stop offset="1" stop-color="#17306e"/>
    </radialGradient>
    <radialGradient id="glowred" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a5a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowblue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fa3ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4fa3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyg)"/>
  <rect x="0" y="0" width="400" height="500" fill="#ff4d4d" opacity="0.05"/>
  <rect x="400" y="0" width="400" height="500" fill="#4d9bff" opacity="0.05"/>
  <line x1="400" y1="40" x2="400" y2="460" stroke="#4a4f80" stroke-width="2" stroke-dasharray="4 10" opacity="0.6"/>

  <g fill="#c7cdf5" opacity="0.5">
