    <circle cx="650" cy="60" r="1.6"/><circle cx="730" cy="100" r="1.2"/><circle cx="560" cy="40" r="1.3"/>
    <circle cx="40" cy="300" r="1.3"/><circle cx="760" cy="320" r="1.4"/>
  </g>

  <circle cx="230" cy="220" r="150" fill="url(#glowred)"/>
  <circle cx="570" cy="220" r="150" fill="url(#glowblue)"/>

  <g>
    <path d="M120 150 h220 a20 20 0 0 1 20 20 v90 a20 20 0 0 1 -20 20 h-150 l-40 35 v-35 h-30 a20 20 0 0 1 -20 -20 v-90 a20 20 0 0 1 20 -20 z" fill="url(#redorb)"/>
    <circle cx="195" cy="215" r="8" fill="#2b0b0e"/>
    <circle cx="265" cy="215" r="8" fill="#2b0b0e"/>
    <path d="M190 250 q40 22 80 0" fill="none" stroke="#2b0b0e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M680 150 h-220 a20 20 0 0 0 -20 20 v90 a20 20 0 0 0 20 20 h150 l40 35 v-35 h30 a20 20 0 0 0 20 -20 v-90 a20 20 0 0 0 -20 -20 z" fill="url(#blueorb)"/>
    <circle cx="605" cy="215" r="8" fill="#0c1c3f"/>
    <circle cx="535" cy="215" r="8" fill="#0c1c3f"/>
    <path d="M530 250 q40 -18 80 0" fill="none" stroke="#0c1c3f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g stroke="#cfd6ff" stroke-width="3" opacity="0.8">
    <line x1="340" y1="330" x2="460" y2="330"/>
    <line x1="340" y1="330" x2="340" y2="345"/>
    <line x1="460" y1="330" x2="460" y2="345"/>
    <circle cx="340" cy="345" r="10" fill="none"/>
    <circle cx="460" cy="345" r="10" fill="none"/>
