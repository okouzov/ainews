<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A faceted gem shape dissolving into a slash-shaped tag icon, representing Gemini's Gems being replaced by Skills">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/><stop offset="1" stop-color="#1a1f2e"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#8f7bff" stop-opacity="0.35"/><stop offset="1" stop-color="#8f7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7c7ff"/><stop offset="1" stop-color="#5b7fe0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <circle cx="400" cy="230" r="230" fill="url(#glow3)"/>
  <polygon points="330,140 470,140 510,210 400,340 290,210" fill="url(#gem3)" opacity="0.85"/>
  <polygon points="330,140 400,210 290,210" fill="#c9dbff" opacity="0.35"/>
  <polygon points="470,140 400,210 510,210" fill="#7893d8" opacity="0.4"/>
  <g fill="#f3b23e">
    <rect x="455" y="300" width="18" height="90" rx="6" transform="rotate(18 464 345)"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="4" fill="#eceaf8">GEMS BECOME SKILLS</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a8a9d6">GEMINI'S NEXT CHAPTER</text>
</svg>
