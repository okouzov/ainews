<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A row of dominoes falling into each other under jagged warning lines, representing a chain reaction of AI-driven risks">
  <defs>
    <linearGradient id="skyg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c1e"/>
      <stop offset="0.7" stop-color="#241022"/>
      <stop offset="1" stop-color="#3a0f12"/>
    </linearGradient>
    <linearGradient id="domino" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.5" stop-color="#e8793a"/>
      <stop offset="1" stop-color="#7a2410"/>
    </linearGradient>
    <radialGradient id="flash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyg2)"/>

  <g stroke="#5a3a6e" stroke-width="0.7" opacity="0.4">
    <path d="M0 120 L800 160" fill="none"/>
    <path d="M0 180 L800 220" fill="none"/>
    <circle cx="120" cy="90" r="2" fill="#cbb4e0" stroke="none"/>
    <circle cx="640" cy="70" r="2" fill="#cbb4e0" stroke="none"/>
    <circle cx="380" cy="50" r="1.4" fill="#cbb4e0" stroke="none"/>
  </g>

  <circle cx="610" cy="300" r="130" fill="url(#flash)"/>

  <g transform="translate(90,340)">
    <rect x="0" y="-130" width="26" height="130" rx="4" fill="url(#domino)" transform="rotate(0)"/>
    <rect x="80" y="-120" width="26" height="120" rx="4" fill="url(#domino)" transform="rotate(18 93 -60)"/>
    <rect x="165" y="-110" width="26" height="110" rx="4" fill="url(#domino)" transform="rotate(34 178 -55)"/>
    <rect x="255" y="-100" width="26" height="100" rx="4" fill="url(#domino)" transform="rotate(48 268 -50)"/>
    <rect x="350" y="-92" width="26" height="92" rx="4" fill="url(#domino)" transform="rotate(58 363 -46)"/>
    <rect x="450" y="-86" width="26" height="86" rx="4" fill="url(#domino)" transform="rotate(64 463 -43)"/>
  </g>

  <g stroke="#ffcf6b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M190 260 l20 -30 l16 18 l22 -26"/>
    <path d="M330 280 l22 -28 l14 16 l24 -22"/>
    <path d="M470 300 l24 -26 l14 16 l26 -20"/>
  </g>

  <g fill="#ffb347" opacity="0.9">
    <circle cx="612" cy="298" r="5"/>
    <circle cx="628" cy="286" r="3"/>
    <circle cx="596" cy="312" r="3"/>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="7" fill="#ffe3c2">CHAIN REACTION</text>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="6" fill="#c99a9f">AI RISK &#183; 2028</text>
</svg>