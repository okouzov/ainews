<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A large cracked speech bubble in warm Anthropic tones, with fragments drifting away, representing a crisis of public trust in AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1210"/><stop offset="1" stop-color="#2e1c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#cc785c" stop-opacity="0.5"/><stop offset="1" stop-color="#cc785c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="210" fill="url(#glow)"/>
  <g fill="none" stroke="#e8956f" stroke-width="3">
    <path d="M260 140 h280 a30 30 0 0 1 30 30 v110 a30 30 0 0 1 -30 30 h-150 l-55 55 v-55 h-75 a30 30 0 0 1 -30 -30 v-110 a30 30 0 0 1 30 -30 z"/>
  </g>
  <g stroke="#160c0a" stroke-width="5">
    <line x1="330" y1="150" x2="370" y2="220"/>
    <line x1="370" y1="220" x2="340" y2="270"/>
    <line x1="340" y1="270" x2="400" y2="310"/>
    <line x1="470" y1="150" x2="440" y2="200"/>
    <line x1="440" y1="200" x2="500" y2="230"/>
  </g>
  <g fill="#f2b880" opacity="0.85">
    <rect x="315" y="330" width="18" height="18" transform="rotate(20 324 339)"/>
    <rect x="470" y="340" width="14" height="14" transform="rotate(-15 477 347)"/>
    <rect x="560" y="200" width="16" height="16" transform="rotate(10 568 208)"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f0e2d6">A CRISIS OF TRUST</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#a99bd6">AMODEI ON THE AI INDUSTRY</text>
</svg>
