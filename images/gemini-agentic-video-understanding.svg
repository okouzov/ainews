<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A video play triangle with only select filmstrip segments lit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141022"/><stop offset="1" stop-color="#26183a"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd6ff"/><stop offset="1" stop-color="#5a8fd6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#3a2f56" stroke-width="1" opacity="0.6">
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
  </g>
  <g transform="translate(400 250)">
    <circle r="95" fill="none" stroke="#4a3f70" stroke-width="3"/>
    <polygon points="-35,-55 -35,55 65,0" fill="url(#play)"/>
  </g>
  <g transform="translate(160 380)">
    <rect x="0" y="0" width="480" height="26" rx="4" fill="#241c38"/>
    <rect x="20" y="4" width="50" height="18" fill="#5a8fd6" opacity="0.9"/>
    <rect x="90" y="4" width="18" height="18" fill="#332a4d"/>
    <rect x="160" y="4" width="90" height="18" fill="#5a8fd6" opacity="0.9"/>
    <rect x="270" y="4" width="18" height="18" fill="#332a4d"/>
    <rect x="330" y="4" width="40" height="18" fill="#5a8fd6" opacity="0.9"/>
    <rect x="390" y="4" width="70" height="18" fill="#332a4d"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="3" fill="#eee6f5">GEMINI GETS AGENTIC VIDEO</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#b19fd6">FLASH MODELS SKIP THE FILLER</text>
</svg>
