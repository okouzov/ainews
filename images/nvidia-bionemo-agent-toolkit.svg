<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A DNA double helix connected by circuit lines to a toolbox icon, over a dark green gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f10"/>
      <stop offset="1" stop-color="#173a1c"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be15d"/>
      <stop offset="1" stop-color="#5fa832"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#2a4a2e" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <g stroke="#5fa832" stroke-width="4" fill="none" opacity="0.9">
    <path d="M230 100 C 290 140 170 180 230 220 C 290 260 170 300 230 340 C 290 380 170 400 230 420"/>
    <path d="M290 100 C 230 140 350 180 290 220 C 230 260 350 300 290 340 C 230 380 350 400 290 420"/>
  </g>
  <g stroke="#3f7a24" stroke-width="3" opacity="0.8">
    <line x1="238" y1="120" x2="282" y2="120"/>
    <line x1="248" y1="160" x2="272" y2="160"/>
    <line x1="238" y1="200" x2="282" y2="200"/>
    <line x1="248" y1="240" x2="272" y2="240"/>
    <line x1="238" y1="280" x2="282" y2="280"/>
    <line x1="248" y1="320" x2="272" y2="320"/>
    <line x1="238" y1="360" x2="282" y2="360"/>
  </g>

  <g stroke="#3f7a24" stroke-width="2" opacity="0.6" fill="none">
    <line x1="330" y1="240" x2="470" y2="240"/>
    <circle cx="400" cy="240" r="5" fill="#9be15d" stroke="none"/>
  </g>

  <g transform="translate(490 190)">
    <rect x="0" y="40" width="130" height="80" rx="8" fill="url(#tool)" stroke="#3f7a24" stroke-width="4"/>
    <rect x="40" y="10" width="50" height="35" rx="6" fill="none" stroke="#3f7a24" stroke-width="8"/>
    <rect x="0" y="70" width="130" height="18" fill="#3f7a24" opacity="0.5"/>
    <circle cx="65" cy="80" r="10" fill="#173a1c"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="4" fill="#dff5df">BIONEMO AGENT TOOLKIT</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8fc498">GIVING AGENTS A LAB</text>
</svg>
