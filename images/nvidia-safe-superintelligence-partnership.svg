<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A large glowing GPU chip feeding power into a smaller node, with an ascending arrow between them">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1218"/><stop offset="1" stop-color="#0f2418"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fdc8a"/><stop offset="1" stop-color="#2a9a5c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(130,170)">
    <rect x="0" y="0" width="180" height="180" rx="14" fill="url(#chip)" opacity="0.9"/>
    <rect x="20" y="20" width="140" height="140" rx="8" fill="#0f2418"/>
    <g stroke="#8ff0b0" stroke-width="3">
      <line x1="-20" y1="30" x2="0" y2="30"/><line x1="-20" y1="60" x2="0" y2="60"/><line x1="-20" y1="90" x2="0" y2="90"/><line x1="-20" y1="120" x2="0" y2="120"/><line x1="-20" y1="150" x2="0" y2="150"/>
      <line x1="180" y1="30" x2="200" y2="30"/><line x1="180" y1="60" x2="200" y2="60"/><line x1="180" y1="90" x2="200" y2="90"/><line x1="180" y1="120" x2="200" y2="120"/><line x1="180" y1="150" x2="200" y2="150"/>
    </g>
    <text x="90" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c8f5da">VERA RUBIN</text>
  </g>
  <g stroke="#5fdc8a" stroke-width="4" fill="none" opacity="0.85">
    <path d="M340 250 L520 190"/>
  </g>
  <path d="M500 210 L525 188 L512 220" fill="#5fdc8a" opacity="0.85"/>
  <g transform="translate(560,120)">
    <circle cx="40" cy="40" r="40" fill="#152a1e" stroke="#5fdc8a" stroke-width="3"/>
    <circle cx="40" cy="34" r="12" fill="#c8f5da"/>
    <rect x="22" y="50" width="36" height="46" rx="10" fill="#c8f5da"/>
    <text x="40" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="2" fill="#8ff0b0">SSI</text>
  </g>
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#dff5e8">COMPUTE PARTNERSHIP</text>
  <text x="400" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fc49a">NVIDIA &#183; SAFE SUPERINTELLIGENCE</text>
