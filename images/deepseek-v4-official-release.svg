<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A clock face split into peak and off-peak pricing segments beside a 1 million token label">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08161c"/><stop offset="1" stop-color="#0e2530"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8956f"/><stop offset="1" stop-color="#d4432f"/>
    </linearGradient>
    <linearGradient id="off" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce0cc"/><stop offset="1" stop-color="#2a8ea6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(300 250)">
    <circle r="140" fill="#0e2530" stroke="#2a8ea6" stroke-width="3"/>
    <path d="M0 0 L0 -140 A140 140 0 0 1 121 -70 Z" fill="url(#peak)" opacity="0.9"/>
    <path d="M0 0 L60 121 A140 140 0 0 1 -60 121 Z" fill="url(#peak)" opacity="0.6"/>
    <path d="M0 0 L121 -70 A140 140 0 0 1 60 121 Z" fill="url(#off)" opacity="0.85"/>
    <path d="M0 0 L-60 121 A140 140 0 0 1 -121 -70 Z" fill="url(#off)" opacity="0.85"/>
    <path d="M0 0 L-121 -70 A140 140 0 0 1 0 -140 Z" fill="url(#off)" opacity="0.6"/>
    <circle r="10" fill="#dff7f2"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#dff7f2" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="90" y2="40" stroke="#dff7f2" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(560 250)">
    <rect x="-90" y="-60" width="180" height="120" rx="14" fill="#123640" opacity="0.9"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#5ce0cc">1M</text>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#bfe8e0">TOKEN CONTEXT</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#e2f5f0">DEEPSEEK V4</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fc4bb">OFFICIAL RELEASE ADDS PEAK-HOUR PRICING</text>
</svg>
