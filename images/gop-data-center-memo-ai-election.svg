<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A row of glowing server racks beside a ballot box under a capitol dome silhouette, in red and blue tones, representing data centers becoming a political issue">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#100c1c"/><stop offset="1" stop-color="#1c1430"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c94b4b" stop-opacity="0.45"/><stop offset="1" stop-color="#c94b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4b7cc9" stop-opacity="0.4"/><stop offset="1" stop-color="#4b7cc9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="270" cy="230" r="170" fill="url(#glowR)"/>
  <circle cx="540" cy="230" r="170" fill="url(#glowB)"/>
  <path d="M330 250 q80 -140 160 0 z" fill="none" stroke="#e0e0f0" stroke-width="2" opacity="0.55"/>
  <line x1="300" y1="250" x2="510" y2="250" stroke="#e0e0f0" stroke-width="2" opacity="0.55"/>
  <g stroke="#8fa8ff" stroke-width="2" opacity="0.7">
    <line x1="320" y1="250" x2="320" y2="330"/><line x1="360" y1="250" x2="360" y2="330"/>
    <line x1="450" y1="250" x2="450" y2="330"/><line x1="490" y1="250" x2="490" y2="330"/>
  </g>
  <g transform="translate(170,300)">
    <rect x="0" y="0" width="60" height="110" rx="4" fill="#1a1330" stroke="#e0736a" stroke-width="2"/>
    <rect x="0" y="130" width="60" height="110" rx="4" fill="#1a1330" stroke="#e0736a" stroke-width="2"/>
    <circle cx="12" cy="14" r="3" fill="#e0736a"/><circle cx="26" cy="14" r="3" fill="#e0736a"/><circle cx="40" cy="14" r="3" fill="#e0736a"/>
    <circle cx="12" cy="144" r="3" fill="#e0736a"/><circle cx="26" cy="144" r="3" fill="#e0736a"/><circle cx="40" cy="144" r="3" fill="#e0736a"/>
  </g>
  <g transform="translate(570,320)" fill="none" stroke="#8fa8ff" stroke-width="3">
    <rect x="0" y="20" width="90" height="60" rx="6"/>
    <path d="M6 20 l39 -26 l39 26" fill="none"/>
    <rect x="34" y="0" width="16" height="24"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="4" fill="#f0e2d6">DATA CENTERS ON THE BALLOT</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#a99bd6">GOP MEMO WARNS OF POLITICAL RISK</text>
</svg>
