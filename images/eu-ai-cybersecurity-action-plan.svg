    </g>
  </g>
  <g transform="translate(330 130)">
    <path d="M70 0 L140 24 L140 100 Q140 180 70 220 Q0 180 0 100 L0 24 Z" fill="url(#shield)" stroke="#6fa8ff" stroke-width="3"/>
    <g stroke="#6fa8ff" stroke-width="2" opacity="0.85">
      <line x1="70" y1="30" x2="70" y2="80"/><line x1="30" y1="60" x2="70" y2="80"/><line x1="110" y1="60" x2="70" y2="80"/>
      <line x1="70" y1="80" x2="70" y2="140"/><line x1="40" y1="120" x2="70" y2="140"/><line x1="100" y1="120" x2="70" y2="140"/>
    </g>
    <g fill="#a9c8ff"><circle cx="70" cy="30" r="4"/><circle cx="30" cy="60" r="3.5"/><circle cx="110" cy="60" r="3.5"/>
      <circle cx="70" cy="80" r="4"/><circle cx="40" cy="120" r="3.5"/><circle cx="100" cy="120" r="3.5"/><circle cx="70" cy="140" r="4"/></g>
