<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A shield with a circuit pattern encircled by European stars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f2a"/><stop offset="1" stop-color="#1a1240"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a5e"/><stop offset="1" stop-color="#111a3c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g fill="#ffd166">
    <g transform="translate(400 210)">
      <g id="star0"><path d="M0 -140 l4.4 9.6 10.4 1.1 -7.8 7 2.2 10.2 -9.2 -5.2 -9.2 5.2 2.2 -10.2 -7.8 -7 10.4 -1.1 z"/></g>
      <use href="#star0" transform="rotate(30)"/><use href="#star0" transform="rotate(60)"/>
      <use href="#star0" transform="rotate(90)"/><use href="#star0" transform="rotate(120)"/>
      <use href="#star0" transform="rotate(150)"/><use href="#star0" transform="rotate(180)"/>
      <use href="#star0" transform="rotate(210)"/><use href="#star0" transform="rotate(240)"/>
      <use href="#star0" transform="rotate(270)"/><use href="#star0" transform="rotate(300)"/>
