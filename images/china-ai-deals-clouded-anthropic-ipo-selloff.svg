<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A falling red candlestick stock chart partly hidden behind a storm cloud over a city skyline"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bgSelloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160f14"/><stop offset="1" stop-color="#241521"/>
    </linearGradient>
    <linearGradient id="cloudSelloff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a52"/><stop offset="1" stop-color="#2c2232"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgSelloff)"/>
  <g opacity="0.5" fill="#241a28">
    <rect x="80" y="300" width="40" height="120"/>
    <rect x="130" y="260" width="40" height="160"/>
    <rect x="180" y="320" width="40" height="100"/>
    <rect x="620" y="280" width="40" height="140"/>
    <rect x="670" y="240" width="40" height="180"/>
  </g>
  <g transform="translate(140,230)" stroke="#e86f6f" stroke-width="5">
    <line x1="0" y1="-10" x2="0" y2="40"/><line x1="40" y1="-30" x2="40" y2="55"/>
    <line x1="80" y1="0" x2="80" y2="75"/><line x1="120" y1="20" x2="120" y2="95"/>
    <line x1="160" y1="35" x2="160" y2="115"/><line x1="200" y1="50" x2="200" y2="135"/>
    <line x1="240" y1="70" x2="240" y2="150"/>
  </g>
  <g fill="url(#cloudSelloff)">
    <ellipse cx="430" cy="190" rx="110" ry="55"/>
    <ellipse cx="500" cy="170" rx="90" ry="50"/>
    <ellipse cx="360" cy="175" rx="80" ry="45"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#ead8e6">A CLOUDED WINDOW TO LIST</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#a08a9c">CHINA'S AI IPOS FACE AN ANTHROPIC-LED SELLOFF</text>
</svg>