      <stop offset="0" stop-color="#e9f2f5"/>
      <stop offset="1" stop-color="#cfe3e8"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6fb8c9"/>
      <stop offset="1" stop-color="#2c6e82"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#b7cfd6" stroke-width="1" opacity="0.7">
    <line x1="0" y1="110" x2="800" y2="110"/>
    <line x1="0" y1="390" x2="800" y2="390"/>
  </g>

  <circle cx="400" cy="235" r="115" fill="url(#globe)"/>
  <g stroke="#1f4f5e" stroke-width="2" fill="none" opacity="0.6">
