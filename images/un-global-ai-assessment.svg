    <ellipse cx="235" cy="235" rx="10" ry="16" transform="rotate(-10 235 235)"/>
    <ellipse cx="250" cy="290" rx="10" ry="16" transform="rotate(20 250 290)"/>
    <ellipse cx="550" cy="180" rx="10" ry="16" transform="rotate(30 550 180)"/>
    <ellipse cx="565" cy="235" rx="10" ry="16" transform="rotate(10 565 235)"/>
    <ellipse cx="550" cy="290" rx="10" ry="16" transform="rotate(-20 550 290)"/>
  </g>

  <g transform="translate(400 235)">
