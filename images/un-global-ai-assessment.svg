  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="4" fill="#1f4f5e">UN'S FIRST AI ASSESSMENT</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#4a7d8c">CONTROL "NOT GUARANTEED"</text>
