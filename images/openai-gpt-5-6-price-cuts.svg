<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Three price tags labeled Luna, Terra and Sol with a falling arrow and a speed gauge">
  <defs>
    <linearGradient id="bg2b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#1a2436"/>
    </linearGradient>
    <linearGradient id="tagg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0c9"/><stop offset="1" stop-color="#3aa6a0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2b)"/>
  <g font-family="Georgia, serif">
    <g transform="translate(150,190)">
      <path d="M0 0 L70 0 L100 30 L70 60 L0 60 Z" fill="url(#tagg)"/>
      <circle cx="18" cy="30" r="6" fill="#0d1420"/>
      <text x="45" y="95" text-anchor="middle" font-size="16" fill="#cfe9e2">LUNA</text>
      <text x="45" y="118" text-anchor="middle" font-size="22" fill="#7fe0c9">-80%</text>
    </g>
    <g transform="translate(340,150)">
