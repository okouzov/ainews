      <text x="45" y="95" text-anchor="middle" font-size="16" fill="#f0d3bf">TERRA</text>
      <text x="45" y="118" text-anchor="middle" font-size="22" fill="#e8956f">-20%</text>
    </g>
    <g transform="translate(530,190)">
