      <circle cx="18" cy="30" r="6" fill="#0d1420"/>
      <text x="45" y="95" text-anchor="middle" font-size="16" fill="#cdd6f5"/>
      <text x="45" y="95" text-anchor="middle" font-size="16" fill="#cdd6f5">SOL</text>
      <text x="45" y="118" text-anchor="middle" font-size="20" fill="#a9b8f0">FAST MODE</text>
    </g>
  </g>
  <g transform="translate(575,150)" stroke="#a9b8f0" stroke-width="4" fill="none">
    <path d="M0 40 A40 40 0 1 1 55 25" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="30" y2="15" stroke-linecap="round"/>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#e9e2d0">GPT-5.6 PRICING</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#8f9dc4">CHEAPER TIERS, A FASTER PAID MODE</text>
