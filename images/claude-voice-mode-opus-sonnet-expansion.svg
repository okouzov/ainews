<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A speech bubble emitting a soundwave, surrounded by small connected app icons">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a33"/><stop offset="1" stop-color="#0c1226"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b880"/><stop offset="1" stop-color="#cc785c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <path d="M290 150 h220 a40 40 0 0 1 40 40 v90 a40 40 0 0 1 -40 40 h-120 l-40 40 v-40 h-60 a40 40 0 0 1 -40 -40 v-90 a40 40 0 0 1 40 -40 z" fill="url(#bubble)"/>
  <g stroke="#241a33" stroke-width="7" stroke-linecap="round">
    <line x1="330" y1="225" x2="330" y2="245"/>
    <line x1="360" y1="205" x2="360" y2="265"/>
    <line x1="390" y1="190" x2="390" y2="280"/>
    <line x1="420" y1="210" x2="420" y2="260"/>
    <line x1="450" y1="195" x2="450" y2="275"/>
    <line x1="480" y1="215" x2="480" y2="255"/>
  </g>
  <g fill="#a9b6e8">
    <circle cx="120" cy="120" r="30"/><circle cx="680" cy="120" r="30"/>
    <circle cx="100" cy="330" r="30"/><circle cx="700" cy="330" r="30"/>
  </g>
  <g stroke="#5c6bcc" stroke-width="2" stroke-dasharray="4 5" opacity="0.7">
    <line x1="150" y1="140" x2="280" y2="190"/><line x1="650" y1="140" x2="520" y2="190"/>
    <line x1="130" y1="320" x2="280" y2="270"/><line x1="670" y1="320" x2="520" y2="270"/>
  </g>
  <text x="120" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#241a33">M</text>
  <text x="680" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#241a33">S</text>
  <text x="100" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#241a33">C</text>
  <text x="700" y="336" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#241a33">N</text>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#f0e2d6">CLAUDE VOICE MODE</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#8f86b8">OPUS AND SONNET, NOW IN GMAIL AND SLACK</text>
