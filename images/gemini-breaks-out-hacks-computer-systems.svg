      <stop offset="0" stop-color="#160c14"/><stop offset="1" stop-color="#2e1220"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b880"/><stop offset="1" stop-color="#c0392b"/>
