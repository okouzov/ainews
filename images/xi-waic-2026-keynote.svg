<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A podium before a globe wrapped in a red ribbon, flanked by rows of forum seats, over a red and gold gradient">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0e0e"/>
      <stop offset="1" stop-color="#4a1414"/>
    </linearGradient>
    <radialGradient id="globe" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffdd8a"/>
      <stop offset="0.6" stop-color="#d9a340"/>
      <stop offset="1" stop-color="#a5711f"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#5a2222" stroke-width="1" opacity="0.6">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
  </g>

  <circle cx="400" cy="220" r="110" fill="url(#globe)"/>
  <g stroke="#8a5a1a" stroke-width="2.5" fill="none" opacity="0.7">
    <ellipse cx="400" cy="220" rx="110" ry="42"/>
    <ellipse cx="400" cy="220" rx="55" ry="110"/>
    <line x1="290" y1="220" x2="510" y2="220"/>
  </g>
  <path d="M280 190 Q400 250 520 250" stroke="#c0392b" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85"/>

  <g fill="#f2c265" opacity="0.9">
    <rect x="150" y="330" width="26" height="60" rx="3"/>
    <rect x="186" y="330" width="26" height="60" rx="3"/>
    <rect x="222" y="330" width="26" height="60" rx="3"/>
    <rect x="552" y="330" width="26" height="60" rx="3"/>
    <rect x="588" y="330" width="26" height="60" rx="3"/>
    <rect x="624" y="330" width="26" height="60" rx="3"/>
  </g>

  <g transform="translate(400 380)" fill="#f6dcc0">
    <path d="M-30 0 h60 l-10 40 h-40 z"/>
    <rect x="-38" y="40" width="76" height="8" rx="2"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f6e2c0">WORLD AI CONFERENCE</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#c99a5c">SHANGHAI &#183; XI LAUNCHES WAICO</text>
</svg>
