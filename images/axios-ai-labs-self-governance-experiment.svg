  <g transform="translate(590,90) rotate(10)"><rect width="70" height="90" rx="6" fill="url(#book)" opacity="0.9"/><rect x="8" y="12" width="54" height="6" fill="#ffffff" opacity="0.6"/><rect x="8" y="26" width="40" height="6" fill="#ffffff" opacity="0.4"/></g>
  <g transform="translate(90,280) rotate(6)"><rect width="60" height="78" rx="6" fill="url(#book)" opacity="0.8"/><rect x="7" y="10" width="46" height="5" fill="#ffffff" opacity="0.6"/></g>
