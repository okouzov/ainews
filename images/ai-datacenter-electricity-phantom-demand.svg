      <stop offset="0" stop-color="#0b1a1c"/><stop offset="1" stop-color="#14262c"/>
    </linearGradient>
    <linearGradient id="real" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd6c2"/><stop offset="1" stop-color="#3f9484"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#2c3763" stroke-width="1" opacity="0.6">
