<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A medical chart with a magnifying eye, showing a read only lock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1f28"/><stop offset="1" stop-color="#1c3644"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6d0"/><stop offset="1" stop-color="#4f9e9e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#2c4552" stroke-width="1" opacity="0.6">
    <line x1="0" y1="140" x2="800" y2="140"/>
    <line x1="0" y1="370" x2="800" y2="370"/>
  </g>
  <g transform="translate(340 250)">
