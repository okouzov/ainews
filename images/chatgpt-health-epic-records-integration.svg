  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="3" fill="#e6f4f5">CHATGPT HEALTH JOINS EPIC</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#9fd6d0">READ-ONLY ACCESS FOR CLINICIANS</text>
