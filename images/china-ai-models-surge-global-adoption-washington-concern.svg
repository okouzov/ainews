<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A world map with a rising bar chart showing surging token share">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151f1a"/><stop offset="1" stop-color="#1c2a22"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#d9784f"/><stop offset="1" stop-color="#f2b880"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <g fill="none" stroke="#4a6a58" stroke-width="1.4" opacity="0.7">
    <circle cx="400" cy="200" r="150"/>
    <ellipse cx="400" cy="200" rx="150" ry="60"/>
    <ellipse cx="400" cy="200" rx="70" ry="150"/>
    <line x1="250" y1="200" x2="550" y2="200"/>
  </g>
  <g transform="translate(150 300)">
    <rect x="0" y="60" width="46" height="40" fill="#6ea885"/>
    <rect x="60" y="30" width="46" height="70" fill="#6ea885"/>
    <rect x="120" y="0" width="46" height="100" fill="url(#bar1)"/>
    <text x="83" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#cfe6d8">FEB</text>
  </g>
  <g transform="translate(420 300)">
    <rect x="0" y="55" width="46" height="45" fill="#6ea885"/>
    <rect x="60" y="20" width="46" height="80" fill="#6ea885"/>
    <rect x="120" y="-15" width="46" height="115" fill="url(#bar1)"/>
    <text x="83" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#cfe6d8">SEP</text>
  </g>
  <path d="M330 330 L440 300" stroke="#f2b880" stroke-width="3" marker-end="url(#arrow2)"/>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f2b880"/>
    </marker>
  </defs>
  <text x="400" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="4" fill="#e6f2ea">CHINA'S MODELS GAIN SHARE</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#6ea885">OPENROUTER · VERCEL · WASHINGTON</text>
</svg>