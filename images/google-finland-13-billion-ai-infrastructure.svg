<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Snowy Nordic landscape at dusk with server racks and a nuclear cooling tower under an aurora glow, representing Google's AI data center investment in Finland">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1a24"/><stop offset="1" stop-color="#0a2a32"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5fd9c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5fd9c4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fb8e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3844"/><stop offset="1" stop-color="#132630"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>
  <path d="M0 60 Q200 10 400 70 T800 50 V0 H0 Z" fill="url(#aurora)"/>
  <path d="M0 90 Q220 40 420 100 T800 80 V0 H0 Z" fill="url(#aurora)" opacity="0.6"/>
  <circle cx="640" cy="90" r="46" fill="#e8f0ea" opacity="0.85"/>
  <path d="M0 340 Q400 300 800 350 V500 H0 Z" fill="url(#snow)"/>
  <g fill="none" stroke="#5fd9c4" stroke-width="3" opacity="0.9">
    <path d="M560 340 C560 270 610 270 610 340" />
    <path d="M540 340 C540 250 630 250 630 340" />
  </g>
  <rect x="520" y="336" width="130" height="14" fill="#132630"/>
  <g fill="#e8f0ea" opacity="0.5">
    <circle cx="600" cy="230" r="3"/><circle cx="615" cy="255" r="2.5"/><circle cx="585" cy="260" r="2"/>
  </g>
  <g>
    <rect x="140" y="270" width="230" height="90" rx="6" fill="#16323c" stroke="#5fd9c4" stroke-width="2"/>
    <g stroke="#7fb8e8" stroke-width="2" opacity="0.85">
      <line x1="160" y1="290" x2="340" y2="290"/>
      <line x1="160" y1="305" x2="340" y2="305"/>
      <line x1="160" y1="320" x2="340" y2="320"/>
      <line x1="160" y1="335" x2="340" y2="335"/>
    </g>
    <g fill="#5fd9c4">
      <circle cx="352" cy="290" r="3"/><circle cx="352" cy="305" r="3"/><circle cx="352" cy="320" r="3"/><circle cx="352" cy="335" r="3"/>
    </g>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="23" letter-spacing="4" fill="#eaf6f2">13 BILLION EUROS FOR FINLAND</text>
  <text x="400" y="466" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fb8e8">GOOGLE&#8217;S AI BUILDOUT, POWERED BY NUCLEAR</text>
</svg>