    <circle cx="80" cy="410" r="2"/><circle cx="730" cy="400" r="2"/>
  </g>

  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="26" letter-spacing="6" fill="#eef0e6">A STAKE FOR THE PUBLIC?</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#8fa3cf">OPENAI FLOATS A 5% GOVERNMENT SHARE</text>
