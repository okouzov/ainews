<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="The Capitol dome beside a pie chart with a five percent slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c33"/>
      <stop offset="1" stop-color="#1c2b4a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <g stroke="#2e4370" stroke-width="1" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="255" x2="800" y2="255"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <g transform="translate(250 0)" fill="#e8e2d2" stroke="#8d8468" stroke-width="3">
    <rect x="-140" y="330" width="280" height="30" rx="4"/>
    <rect x="-120" y="300" width="240" height="30" rx="4"/>
    <g stroke="#8d8468" stroke-width="3">
      <line x1="-95" y1="300" x2="-95" y2="330"/><line x1="-55" y1="300" x2="-55" y2="330"/>
      <line x1="-15" y1="300" x2="-15" y2="330"/><line x1="25" y1="300" x2="25" y2="330"/>
      <line x1="65" y1="300" x2="65" y2="330"/><line x1="95" y1="300" x2="95" y2="330"/>
    </g>
    <path d="M-88 300 q0 -78 88 -92 q88 14 88 92 z"/>
    <path d="M-58 208 q58 -34 116 0 l-8 14 q-50 -26 -100 0 z" transform="translate(-29 -6) scale(1 1)"/>
    <rect x="-16" y="158" width="32" height="34" rx="4"/>
    <path d="M0 122 l10 22 h-20 z"/>
    <circle cx="0" cy="118" r="7"/>
  </g>

  <g transform="translate(575 225)">
