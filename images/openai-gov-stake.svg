    <line x1="22" y1="-72" x2="66" y2="-132" stroke="#ffd166" stroke-width="2.5"/>
    <text x="72" y="-138" font-family="Georgia, serif" font-size="30" fill="#ffd166">5%</text>
  </g>

  <g fill="#d7deee" opacity="0.85">
