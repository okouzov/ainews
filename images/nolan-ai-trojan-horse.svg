<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A glass Trojan horse silhouette glowing with circuit lines at night">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090a16"/><stop offset="1" stop-color="#1c1430"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd8e8" stop-opacity="0.22"/><stop offset="1" stop-color="#7fd8e8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g fill="#f2b880" opacity="0.8">
    <circle cx="120" cy="80" r="1.6"/><circle cx="180" cy="120" r="1.3"/><circle cx="640" cy="70" r="1.6"/>
    <circle cx="700" cy="130" r="1.3"/><circle cx="90" cy="200" r="1.3"/><circle cx="720" cy="220" r="1.6"/>
  </g>
  <rect x="0" y="400" width="800" height="4" fill="#2c2340"/>
  <g transform="translate(240 160)">
    <path d="M0 220 L20 150 Q40 90 120 80 Q170 74 200 100 L260 90 Q300 86 320 110 L340 220 Z" fill="url(#glass)" stroke="#9fe6f2" stroke-width="2.5"/>
    <path d="M320 110 Q340 60 300 40 Q330 70 300 100" fill="none" stroke="#9fe6f2" stroke-width="2.5"/>
    <g stroke="#9fe6f2" stroke-width="2.5"><line x1="60" y1="220" x2="60" y2="260"/><line x1="60" y1="260" x2="40" y2="300"/>
      <line x1="260" y1="220" x2="260" y2="260"/><line x1="260" y1="260" x2="280" y2="300"/></g>
    <g stroke="#f2b880" stroke-width="2" opacity="0.9">
      <line x1="40" y1="130" x2="120" y2="150"/><line x1="120" y1="150" x2="90" y2="200"/>
      <line x1="120" y1="150" x2="190" y2="130"/><line x1="190" y1="130" x2="240" y2="170"/>
      <line x1="190" y1="130" x2="170" y2="90"/>
    </g>
    <g fill="#ffd166"><circle cx="120" cy="150" r="4"/><circle cx="90" cy="200" r="3"/><circle cx="190" cy="130" r="4"/>
      <circle cx="170" cy="90" r="3"/><circle cx="240" cy="170" r="3"/></g>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#e6e2f0">A TRANSPARENT HORSE</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#8f86b8">CHRISTOPHER NOLAN ON AI</text>
</svg>
