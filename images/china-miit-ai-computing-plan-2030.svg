    <rect x="150" y="166" width="70" height="26" rx="3"/><rect x="235" y="166" width="70" height="26" rx="3"/><rect x="320" y="166" width="70" height="26" rx="3"/><rect x="405" y="166" width="70" height="26" rx="3"/><rect x="490" y="166" width="70" height="26" rx="3"/><rect x="575" y="166" width="70" height="26" rx="3"/>
