  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(360 210)">
    <path d="M0 -180 L171 -55 L106 146 L-106 146 L-171 -55 Z" fill="#12203a" stroke="#5b7fae" stroke-width="5"/>
    <g transform="translate(-58 -30)">
