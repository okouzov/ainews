<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A tall bar for OpenAI and Anthropic revenue beside a short stacked bar for seven Chinese AI developers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1424"/><stop offset="1" stop-color="#1e1408"/>
    </linearGradient>
    <linearGradient id="us" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce6a"/><stop offset="1" stop-color="#d8892f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.3"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="285" cy="230" r="200" fill="url(#glow)"/>
  <line x1="150" y1="350" x2="650" y2="350" stroke="#3a437e" stroke-width="1.5"/>
  <rect x="220" y="110" width="130" height="240" fill="url(#us)"/>
  <text x="285" y="98" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#ffe6a1">$100B+</text>
  <rect x="450" y="324.3" width="130" height="10.3" fill="#ff8a7a"/>
  <rect x="450" y="334.6" width="130" height="5.8" fill="#e8552f"/>
  <rect x="450" y="340.4" width="130" height="9.6" fill="#b3341c"/>
  <text x="515" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#ffb3a6">$10.7B</text>
  <g font-family="Georgia, serif" font-size="10" letter-spacing="1" fill="#c9cff5">
    <text x="592" y="333">OTHER FIVE $4.3B</text>
    <text x="592" y="343">ALIBABA $2.4B</text>
    <text x="592" y="353">BYTEDANCE $4.0B</text>
  </g>
  <text x="400" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#ffe6a1">≈ 10%</text>
  <g font-family="Georgia, serif" font-size="11" letter-spacing="2" text-anchor="middle" fill="#9aa3d8">
    <text x="285" y="374">OPENAI + ANTHROPIC</text>
    <text x="515" y="374">7 CHINESE DEVELOPERS</text>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#f0e6c8">CHINA VS US AI REVENUE</text>
  <text x="400" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="4" fill="#8f97c9">ANNUAL RECURRING REVENUE · RHODIUM GROUP</text>
