  <text x="400" y="448" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="6" fill="#eaf5ee">GOVERNMENT PRICING SHIFT</text>
  <text x="400" y="477" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#7fb8a6">FROM $1 PILOT TO 50% DISCOUNT</text>
