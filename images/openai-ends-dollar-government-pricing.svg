<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A single dollar coin tipping a balance scale toward stacked coin towers"><defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a1c"/><stop offset="1" stop-color="#132a2c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe6c8"/><stop offset="1" stop-color="#4a9d82"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g stroke="#3a5a56" stroke-width="1" opacity="0.5">
    <line x1="110" y1="120" x2="170" y2="120"/><line x1="110" y1="140" x2="210" y2="140"/>
    <line x1="620" y1="130" x2="680" y2="130"/><line x1="600" y1="150" x2="670" y2="150"/>
  </g>
  <line x1="220" y1="230" x2="580" y2="230" stroke="#5c8f83" stroke-width="6"/>
