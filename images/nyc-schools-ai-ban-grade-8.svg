<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A crossed-out chat bubble above a chalkboard and a city skyline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1022"/><stop offset="1" stop-color="#241a12"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a34"/><stop offset="1" stop-color="#14261f"/>
    </linearGradient>
    <radialGradient id="bub" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f6e7c9"/><stop offset="1" stop-color="#c98b2f"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g opacity="0.5" fill="#0e1830">
    <rect x="40" y="300" width="60" height="120"/>
    <rect x="120" y="260" width="50" height="160"/>
    <rect x="188" y="320" width="70" height="100"/>
    <rect x="560" y="280" width="55" height="140"/>
    <rect x="632" y="240" width="60" height="180"/>
    <rect x="708" y="310" width="52" height="110"/>
  </g>
  <rect x="250" y="250" width="300" height="180" rx="8" fill="url(#board)" stroke="#3c5c52" stroke-width="4"/>
  <g stroke="#8fb3a6" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="280" y1="290" x2="470" y2="290"/>
    <line x1="280" y1="320" x2="430" y2="320"/>
    <line x1="280" y1="350" x2="500" y2="350"/>
  </g>
  <g transform="translate(400 150)">
    <path d="M-110 -60 Q-130 -60 -130 -40 L-130 40 Q-130 60 -110 60 L-40 60 L0 100 L0 60 L110 60 Q130 60 130 40 L130 -40 Q130 -60 110 -60 Z" fill="url(#bub)" opacity="0.95"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-size="52" fill="#2a1c0c">AI</text>
    <circle r="120" fill="none" stroke="#e0563c" stroke-width="12"/>
    <line x1="-86" y1="86" x2="86" y2="-86" stroke="#e0563c" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="400" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="24" letter-spacing="5" fill="#f0e6d2" font-variant="small-caps">New York Pulls the Plug on Classroom AI</text>
  <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="13" letter-spacing="4" fill="#d8a24f">A ONE-YEAR MORATORIUM THROUGH EIGHTH GRADE</text>
</svg>