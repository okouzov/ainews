<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="A lightning bolt breaking out of a dashed preview frame beside a price tag showing a third of the original price">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/><stop offset="1" stop-color="#141d33"/>
    </linearGradient>
    <linearGradient id="bolt1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ef8f3c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect x="130" y="120" width="230" height="230" rx="10" fill="none" stroke="#3a4a6b" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="245" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="3" fill="#7c8bb0">PREVIEW</text>
  <polygon points="270,150 210,270 250,270 220,340 340,190 285,190 320,150" fill="url(#bolt1)"/>
  <g transform="translate(560,235)">
    <rect x="-110" y="-90" width="220" height="180" rx="16" fill="#1b2542" opacity="0.9" stroke="#ef8f3c" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#9fb0d6">V4-PRO</text>
    <line x1="-70" y1="-20" x2="70" y2="-20" stroke="#5a6690" stroke-width="2"/>
    <text x="0" y="15" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#ffd166">1/3</text>
    <text x="0" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e7c98f">OF THE PRICE</text>
  </g>
  <text x="400" y="440" text-anchor="middle" font-family="Georgia, serif" font-size="22" letter-spacing="5" fill="#efe3d0">V4-FLASH-0731</text>
  <text x="400" y="468" text-anchor="middle" font-family="Georgia, serif" font-size="12" letter-spacing="3" fill="#8f9dc4">FROM PREVIEW TO FULL RELEASE</text>
</svg>