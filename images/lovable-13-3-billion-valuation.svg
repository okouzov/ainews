  <text x="600" y="255" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#a99bd6">VALUATION</text>
  <text x="400" y="465" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="5" fill="#f0e2d6">LOVABLE RAISES $400M</text>
