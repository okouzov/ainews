      <stop offset="0" stop-color="#170f22"/><stop offset="1" stop-color="#2a1428"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f06292" stop-opacity="0.45"/><stop offset="1" stop-color="#f06292" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="0" y2="1">
